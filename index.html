  }
  if ($('#f_provinsi')) { $('#f_provinsi').addEventListener('change', isiKab); isiKab(); }
  if ($('#f_kab_kota')) $('#f_kab_kota').addEventListener('change', isiKec);

  /* deteksi perubahan */
  const form = $('#form-ubah');
  $('.lompat', form).addEventListener('click', e => { const b = e.target.closest('[data-lompat]'); if (b) { const t = document.getElementById(b.dataset.lompat); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
  pasangKunci(form);
  const ubahan = () => { const now = bacaForm(form, { kolom: formCols }); const o = {}; formCols.forEach(c => { if (!sama(now[c.kolom], awal[c.kolom])) o[c.kolom] = now[c.kolom]; }); return o; };
  /* draf otomatis di browser: aman saat internet putus atau sesi habis */
  const kd = 'lp2pp.draf.' + (S.user.email || S.user.id_user || 'u') + '.' + id;
  const bacaDraf = () => { try { const j = JSON.parse(store.get(kd) || 'null'); return j && j.f && typeof j.f === 'object' ? j : null; } catch (e) { return null; } };
  const tulisDraf = () => {
    if (!S.user) return;
    const ub = ubahan();
    if (!Object.keys(ub).length) { store.del(kd); return; }
    const dasar = {}; Object.keys(ub).forEach(k => dasar[k] = awal[k]);
    store.set(kd, JSON.stringify({ t: Date.now(), f: ub, dasar }));
  };
  const isiNilai = (k, v) => {
    const c = formCols.find(x => x.kolom === k); if (!c) return false;
    if (c.tipe === 'multi') { const arr = Array.isArray(v) ? v : String(v || '').split(',').map(x => x.trim()); $$(`[data-multi="${k}"]`, form).forEach(x => x.checked = arr.includes(x.value)); return true; }
    const e = $('#f_' + k, form); if (!e) return false; e.value = v; return true;
  };
  const offline = () => typeof navigator !== 'undefined' && navigator.onLine === false;
  let baruSimpan = false;
  const upStatus = () => {
    const ub = ubahan(), n = Object.keys(ub).length, st = $('#status-form'), at = $('#draf-atas');
    $$('.fl.berubah', form).forEach(x => x.classList.remove('berubah'));
    Object.keys(ub).forEach(k => { const f = $(`[data-k="${k}"]`, form); if (f) f.classList.add('berubah'); });
    if (n) {
      baruSimpan = false;
      const off = offline();
      st.innerHTML = off ? `<span class="lencana offline">Offline: ${n} kolom hanya ada di draf browser</span>` : `<span class="lencana draf">Draf: ${n} kolom belum disimpan ke sistem</span>`;
      at.className = 'draf-atas' + (off ? ' offline' : '');
      at.innerHTML = off
        ? `<b>Anda sedang offline.</b> ${n} kolom yang Anda ubah belum masuk ke sistem, tetapi aman tersimpan sementara di browser ini sebagai draf. Klik <b>Simpan perubahan</b> setelah internet pulih.`
        : `<b>Belum disimpan ke sistem.</b> ${n} kolom yang Anda ubah tersimpan sementara di browser ini sebagai draf. Klik <b>Simpan perubahan</b> agar masuk ke sistem.`;
      at.hidden = false;
    } else {
      at.hidden = true;
      st.innerHTML = baruSimpan ? '<span class="lencana aman">Semua perubahan sudah tersimpan di sistem</span>' : `<span class="lencana ${offline() ? 'offline' : ''}">${offline() ? 'Sedang offline' : 'Belum ada perubahan'}</span>`;
    }
  };
  let tDraf = null;
  const jadwalDraf = () => { clearTimeout(tDraf); tDraf = setTimeout(tulisDraf, 400); };
  form.addEventListener('input', () => { upStatus(); jadwalDraf(); }); form.addEventListener('change', () => { upStatus(); jadwalDraf(); });
  const flush = () => { if (document.body.contains(form)) { clearTimeout(tDraf); tulisDraf(); } };
  const onHide = () => { if (document.visibilityState === 'hidden') flush(); };
  const onNet = () => { if (!document.body.contains(form)) { window.removeEventListener('online', onNet); window.removeEventListener('offline', onNet); document.removeEventListener('visibilitychange', onHide); window.removeEventListener('pagehide', flush); return; } upStatus(); if (!offline() && Object.keys(ubahan()).length) toast('Koneksi pulih. Klik Simpan perubahan untuk mengirim.'); };
  window.addEventListener('online', onNet); window.addEventListener('offline', onNet);
  document.addEventListener('visibilitychange', onHide); window.addEventListener('pagehide', flush);

  const dr = bacaDraf();
  if (dr) {
    const kunci = Object.keys(dr.f).filter(k => isiNilai(k, dr.f[k]));
    const bentrok = kunci.filter(k => dr.dasar && !sama(dr.dasar[k], awal[k]));
    if (kunci.length) {
      const waktu = new Date(dr.t).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
      $('#draf-info').innerHTML = `<div class="info" style="margin-bottom:16px" role="status"><b>Draf perubahan dipulihkan</b><div>${kunci.length} kolom dari draf yang tersimpan di browser ini (${esc(waktu)}). Belum dikirim ke server.</div>${bentrok.length ? `<div class="peringatan" style="margin-top:8px">Data di server sudah berubah sejak draf dibuat pada: ${bentrok.map(k => esc(label(formCols.find(c => c.kolom === k)))).join(', ')}. Periksa sebelum menyimpan.</div>` : ''}<div style="margin-top:8px"><button class="btn sek kecil" type="button" id="btn-buang-draf">Buang draf</button></div></div>`;
      $('#btn-buang-draf').onclick = async () => {
        if (!await konfirmasi('Buang draf?', 'Isian kembali ke data yang tersimpan di server. Perubahan di draf akan hilang.', 'Buang draf', true)) return;
        formCols.forEach(c => isiNilai(c.kolom, awal[c.kolom]));
        store.del(kd); $('#draf-info').innerHTML = ''; upStatus(); toast('Draf dibuang.');
      };
      if ($('#f_provinsi')) isiKab();
      upStatus();
    } else store.del(kd);
  }
  upStatus();
  window.onbeforeunload = null;

  form.onsubmit = async e => {
    e.preventDefault();
    $$('.fl.salah', form).forEach(x => { x.classList.remove('salah'); $('.err', x).textContent = ''; });
    const ub = ubahan();
    if (!Object.keys(ub).length) { toast('Belum ada yang diubah.'); return; }
    const salah = periksaAturan(form, Object.keys(ub));
    Object.keys(ub).forEach(k => { const c = formCols.find(x => x.kolom === k), f = $(`[data-k="${k}"]`, form); if (!c || !f || !c.wajib) return; const v = Array.isArray(ub[k]) ? ub[k].join('') : String(ub[k] == null ? '' : ub[k]).trim(); if (!v) { tampilErr(f, label(c) + ' wajib diisi.'); salah.push(f); } });
    if (salah.length) { toast(`Periksa ${salah.length} isian yang belum sesuai.`, 'galat'); salah[0].scrollIntoView({ block: 'center' }); const i = $('input,select,textarea', salah[0]); if (i) i.focus(); return; }
    const b = $('#btn-simpan'); b.disabled = true; b.textContent = 'Menyimpan…';
    try {
      const r = await api('update', { id, fields: ub });
      toast(r.pesan || 'Perubahan tersimpan.');
      const pf = $('#peringatan-form');
      pf.innerHTML = r.peringatan && r.peringatan.length ? `<div class="peringatan" style="margin-bottom:16px"><b>Data sudah tersimpan, tetapi ada angka yang belum cocok</b>${peringatanHtml(r.peringatan)}</div>` : '';
      Object.keys(ub).forEach(k => awal[k] = ub[k]);
      clearTimeout(tDraf); tulisDraf(); $('#draf-info').innerHTML = '';
      upStatus(); baruSimpan = true; upStatus();
      if (!(r.peringatan && r.peringatan.length)) { go('/pesantren/' + id); return; }
      window.scrollTo(0, 0);
    } catch (x) {
      clearTimeout(tDraf); tulisDraf();
      if (x.jaringan) { toast('Tidak ada koneksi. Perubahan Anda aman sebagai draf di browser ini. Klik Simpan lagi setelah internet pulih.', 'galat'); upStatus(); b.disabled = false; b.textContent = 'Simpan perubahan'; return; }
      if (!x.ditangani) {
        const m = x.message || 'Gagal menyimpan.';
        const hit = formCols.find(c => m.indexOf(label(c).slice(0, 18)) === 0 || m.indexOf((c.label || '').replace(/\s*\(.*$/, '').slice(0, 18)) === 0);
        if (hit) { const f = $(`[data-k="${hit.kolom}"]`, form); if (f) { f.classList.add('salah'); $('.err', f).textContent = m; f.scrollIntoView({ block: 'center' }); const i = $('input,select,textarea', f); if (i) i.focus(); } }
        toast(m, 'galat');
      }
    }
    b.disabled = false; b.textContent = 'Simpan perubahan';
  };

  /* berkas */
  const blok = $('#blok-berkas');
  function gambarBlok(docs) {
    blok.innerHTML = Object.keys(JUDUL_BERKAS).map(j => {
      const ds = docs.filter(x => x.jenis === j), sp = j === 'foto' ? pilihSampul(ds) : null;
      return `<div class="fl penuh" data-j="${j}"><span class="lab">${esc(JUDUL_BERKAS[j])} <span class="muted kecil">(${ds.length} dari ${MAKS_BERKAS[j]})</span></span>
        ${ds.length ? `<ul class="berkas-list">${ds.map(x => `<li>${x.thumb && /\.(jpe?g|png|webp)$/i.test(x.nama_file || '') || (j === 'foto' && x.thumb) ? `<img src="${esc(x.thumb)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<div class="ikon">PDF</div>'}<div class="info-b"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.nama_file || 'Berkas lama dari formulir')}</a>${j === 'foto' && sp && sp.f.id_dok === x.id_dok ? `<span class="sampul-tag">${sp.eksplisit ? 'Foto sampul' : 'Sampul otomatis'}</span>` : ''}</div><div class="aksi-b">${j === 'foto' && !(sp && sp.eksplisit && sp.f.id_dok === x.id_dok) ? `<button class="btn sek kecil" type="button" data-sampul="${esc(x.id_dok)}">Jadikan sampul</button>` : ''}<button class="btn bahaya kecil" type="button" data-hapus="${esc(x.id_dok)}">Hapus</button></div></li>`).join('')}</ul>` : '<span class="muted kecil">Belum ada berkas.</span>'}
        <div><input type="file" data-up="${j}" accept="${j === 'foto' ? 'image/jpeg,image/png,image/webp' : 'image/jpeg,image/png,image/webp,application/pdf'}" multiple ${ds.length >= MAKS_BERKAS[j] ? 'disabled' : ''} aria-label="Tambah ${esc(JUDUL_BERKAS[j])}"></div>
        <span class="hint">JPG, PNG, WEBP${j === 'foto' ? '' : ', atau PDF'}. Maksimal 8 MB per berkas; foto dikecilkan otomatis.</span>${j === 'foto' ? '<span class="hint">Foto sampul tampil di kartu pesantren pada beranda dan sebagai banner di bagian atas profil. Pilih foto bangunan atau kegiatan yang mendatar, bukan logo.</span>' : ''}</div>`;
    }).join('');
  }
  let docs = d.dokumen.slice();
  gambarBlok(docs);
  blok.addEventListener('click', async e => {
    const sm = e.target.closest('[data-sampul]');
    if (sm) {
      sm.disabled = true;
      try { await api('setSampul', { id, id_dok: sm.dataset.sampul }); docs.forEach(x => { x.sampul = x.id_dok === sm.dataset.sampul; }); gambarBlok(docs); toast('Foto sampul diperbarui.'); }
      catch (x) { if (!x.ditangani) toast(x.message, 'galat'); sm.disabled = false; }
      return;
    }
    const h = e.target.closest('[data-hapus]'); if (!h) return;
    if (!await konfirmasi('Hapus berkas ini?', 'Berkas akan dihapus dari daftar pesantren dan dipindahkan ke tempat sampah Drive.', 'Hapus berkas', true)) return;
    h.disabled = true;
    try { await api('deleteDoc', { id_dok: h.dataset.hapus }); docs = docs.filter(x => x.id_dok !== h.dataset.hapus); gambarBlok(docs); toast('Berkas dihapus.'); }
    catch (x) { toast(x.message, 'galat'); h.disabled = false; }
  });
  blok.addEventListener('change', async e => {
    const inp = e.target.closest('[data-up]'); if (!inp || !inp.files.length) return;
    const j = inp.dataset.up, files = Array.from(inp.files);
    inp.disabled = true;
    let n = 0;
    for (const f of files) {
      try {
        toast(`Mengunggah ${f.name} (${++n}/${files.length})…`);
        const pay = await siapkanBerkas(f);
        const r = await api('uploadDoc', Object.assign({ id, jenis: j }, pay));
        docs.push({ id_dok: r.id_dok, jenis: j, url: r.url, nama_file: r.nama_file, thumb: r.thumb });
        if (r.peringatan) toast(r.peringatan, 'galat');
      } catch (x) { toast(`${f.name}: ${x.message}`, 'galat'); }
    }
    gambarBlok(docs); toast('Unggahan selesai.');
  });
}

function bacaBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Berkas tidak dapat dibaca.')); r.readAsDataURL(blob); });
}
async function siapkanBerkas(file) {
  if (file.type === 'application/pdf') {
    if (file.size > 8 * 1024 * 1024) throw new Error('Ukuran PDF maksimal 8 MB.');
    return { mime: file.type, nama_file: file.name, data: await bacaBase64(file) };
  }
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error('Format harus JPG, PNG, WEBP, atau PDF.');
  try {
    const bmp = await createImageBitmap(file);
    const maks = 1600, sk = Math.min(1, maks / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sk); cv.height = Math.round(bmp.height * sk);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
    return { mime: 'image/jpeg', nama_file: file.name, data: await bacaBase64(blob) };
  } catch (e) {
    if (file.size > 8 * 1024 * 1024) throw new Error('Ukuran gambar maksimal 8 MB.');
    return { mime: file.type, nama_file: file.name, data: await bacaBase64(file) };
  }
}

/* --- autocomplete pesantren --- */
function pasangAutocomplete(root, inputSel, hiddenSel) {
  const inp = $(inputSel, root), hid = $(hiddenSel, root);
  const box = document.createElement('div'); box.className = 'ac-list'; box.hidden = true; inp.parentNode.appendChild(box);
  const cari = debounce(async () => {
    const t = inp.value.trim(); hid.value = '';
    if (t.length < 2) { box.hidden = true; return; }
    try {
      const r = await api('list', { q: t, per_halaman: 8 });
      box.innerHTML = r.item.length ? r.item.map(o => `<div data-id="${esc(o.id)}" data-n="${esc(o.nama)}">${esc(o.nama)}<br><small>${esc(o.id)} · ${esc([o.kab_kota, o.provinsi].filter(Boolean).join(', '))}</small></div>`).join('') : '<div class="muted">Tidak ditemukan</div>';
      box.hidden = false;
    } catch (e) { box.hidden = true; }
  }, 280);
  inp.addEventListener('input', cari);
  box.addEventListener('click', e => { const d = e.target.closest('[data-id]'); if (!d) return; hid.value = d.dataset.id; inp.value = d.dataset.n + ' (' + d.dataset.id + ')'; box.hidden = true; });
  document.addEventListener('click', e => { if (!root.contains(e.target)) box.hidden = true; });
}

  let kabKode = {};

  };

    const b = $('#btn-tambah'); b.disabled = true;

    const body = { fields, abaikan_duplikat: abaikan || undefined };
    if ($('#t-aemail').value.trim()) body.admin = { email: $('#t-aemail').value.trim(), nama: $('#t-anama').value.trim() };
    try {
      const r = await api('create', body);
      toast('Pesantren ' + r.id + ' ditambahkan.');
      if (r.akun) tampilRahasia('Akun admin pesantren dibuat', 'Berikan data masuk ini kepada admin pesantren.', r.akun.email, r.akun.password_awal);
      go('/ubah/' + r.id);
    } catch (x) {
      if (x.kode === 'DUPLIKAT') { b.disabled = false; if (await konfirmasi('Nama sudah ada', x.message + ' Tetap tambahkan sebagai pesantren baru?', 'Tetap tambahkan')) kirim(true); return; }
      if (!x.ditangani) { er.textContent = x.message; er.style.display = 'block'; er.scrollIntoView({ block: 'center' }); }
      b.disabled = false;
    }
  };
  $('#f-tambah').onsubmit = e => { e.preventDefault(); kirim(false); };
}

const UND_STATUS = {
  aktif: ['biru', 'Menunggu diisi'], diajukan: ['emas', 'Menunggu persetujuan'], disetujui: ['', 'Disetujui'],
  ditolak: ['merah', 'Ditolak'], dicabut: ['abu', 'Dicabut'], kedaluwarsa: ['abu', 'Kedaluwarsa']
};
function undanganHtml(list) {
  const urut = list.slice().sort((a, b) => (b.status === 'diajukan') - (a.status === 'diajukan'));
  const n = list.filter(x => x.status === 'diajukan').length;
  return `<section class="form-seksi seksi-tegas" id="und-bagian" style="margin-bottom:30px"><h2>Undangan admin pondok (token)</h2>
    <div style="padding:20px;background:var(--putih)">
      <p class="muted" style="max-width:70ch">Buat token untuk satu pesantren, lalu berikan ke admin pesantren. Admin masuk lewat <b>Masuk → Masuk dengan token</b>, mengisi email, nama admin, nama pondok, dan password. Akun baru aktif setelah Anda menyetujuinya di sini.</p>
      <div class="grid-form" style="padding:16px 0 0;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;align-items:end">
        <div class="fl ac" id="und-pes-bungkus"><label for="und-pes">Pesantren</label><input id="und-pes" type="text" placeholder="Ketik nama pesantren…" autocomplete="off"><input id="und-pes-id" type="hidden"></div>
        <div class="fl"><label for="und-hari">Masa berlaku</label><select id="und-hari"><option value="7">7 hari</option><option value="14" selected>14 hari</option><option value="30">30 hari</option><option value="60">60 hari</option></select></div>
        <button class="btn" type="button" id="und-buat">Buat token</button>
      </div>
      <div id="und-err" class="galat" role="alert" style="display:none;margin:12px 0 0"></div>
      ${n ? `<div class="peringatan" style="margin-top:18px"><b>${n} pengajuan menunggu keputusan Anda.</b> Periksa datanya di bawah, lalu setujui atau tolak.</div>` : ''}
      <div style="display:grid;gap:12px;margin-top:18px">
      ${urut.length ? urut.map(o => { const st = UND_STATUS[o.status] || ['abu', o.status]; const beda = o.nama_pondok && o.nama_pesantren && o.nama_pondok.trim().toLowerCase() !== o.nama_pesantren.trim().toLowerCase();
        return `<div class="und-item ${o.status === 'diajukan' ? 'perlu' : ''}"><div class="und-kepala"><b>${esc(o.nama_pesantren || o.id_pesantren)}</b><span class="chip ${st[0]}">${esc(st[1])}</span></div>
          <dl class="und-data"><dt>ID</dt><dd>${esc(o.id_pesantren)} · ${esc(o.id_undangan)}</dd><dt>Dibuat</dt><dd>${esc(o.dibuat_pada)} oleh ${esc(o.dibuat_oleh)}; berlaku sampai ${esc(String(o.kadaluarsa).slice(0, 10))}</dd>
          ${o.email ? `<dt>Email admin</dt><dd>${esc(o.email)}</dd><dt>Nama admin</dt><dd>${esc(o.nama_admin)}</dd><dt>Nama pondok (diisi)</dt><dd class="${beda ? 'beda' : ''}">${esc(o.nama_pondok)}${beda ? ' (berbeda dari data terdaftar)' : ''}</dd><dt>Nama terdaftar</dt><dd>${esc(o.nama_pesantren)}</dd><dt>Dikirim</dt><dd>${esc(o.diajukan_pada)}</dd>` : ''}
          ${o.catatan ? `<dt>Catatan</dt><dd>${esc(o.catatan)}</dd>` : ''}</dl>
          <div class="und-aksi">${o.status === 'diajukan' ? `<button class="btn kecil" data-und="setuju" data-id="${esc(o.id_undangan)}" data-e="${esc(o.email)}">Setujui dan aktifkan akun</button><button class="btn bahaya kecil" data-und="tolak" data-id="${esc(o.id_undangan)}">Tolak</button>` : ''}${['aktif', 'diajukan', 'ditolak'].includes(o.status) ? `<button class="btn sek kecil" data-und="cabut" data-id="${esc(o.id_undangan)}">Cabut token</button>` : ''}</div></div>`; }).join('') : '<p class="muted">Belum ada undangan.</p>'}
      </div></div></section>`;
}
function pasangUndangan(el) {
  pasangAutocomplete($('#und-pes-bungkus'), '#und-pes', '#und-pes-id');
  $('#und-buat').onclick = async () => {
    const er = $('#und-err'); er.style.display = 'none';
    if (!$('#und-pes-id').value) { er.textContent = 'Pilih pesantren dari daftar yang muncul saat Anda mengetik.'; er.style.display = 'block'; return; }
    const b = $('#und-buat'); b.disabled = true;
    try {
      const r = await api('buatUndangan', { id_pesantren: $('#und-pes-id').value, hari: $('#und-hari').value });
      const alamat = location.origin + location.pathname + '#/token';
      const pesan = `Assalamualaikum. Berikut token undangan admin ${r.nama_pesantren} di ${judulSitus()}.\nToken: ${r.token}\nBuka ${alamat} lalu isi data admin. Token berlaku sampai ${String(r.kadaluarsa).slice(0, 10)}.`;
      const d = modal(`<div class="dlg-isi"><h2>Token undangan dibuat</h2><p>Untuk <b>${esc(r.nama_pesantren)}</b> (${esc(r.id_pesantren)}). Berlaku sampai ${esc(String(r.kadaluarsa).slice(0, 10))}.</p>
        <div class="rahasia tokenbox">${esc(r.token)}</div>
        <p class="kecil muted">Token hanya tampil sekali dan tersimpan sebagai hash. Token lama untuk pesantren ini otomatis dicabut.</p></div>
        <div class="dlg-aksi"><button class="btn sek" data-x="token">Salin token</button><button class="btn sek" data-x="pesan">Salin pesan undangan</button><button class="btn" data-x="tutup">Selesai</button></div>`);
      const salin = (t, m) => (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(m), () => toast('Salin manual dari kotak kuning.', 'galat'));
      d.addEventListener('click', e => { const x = e.target.closest('[data-x]'); if (!x) return; if (x.dataset.x === 'token') salin(r.token, 'Token disalin.'); else if (x.dataset.x === 'pesan') salin(pesan, 'Pesan undangan disalin.'); else d.close(); });
      d.addEventListener('close', () => render());
    } catch (x) { if (!x.ditangani) { er.textContent = x.message; er.style.display = 'block'; } b.disabled = false; }
  };
  $('#und-bagian').addEventListener('click', async e => {
    const t = e.target.closest('[data-und]'); if (!t) return;
    const k = t.dataset.und, id = t.dataset.id;
    try {
      if (k === 'setuju') {
        if (!await konfirmasi('Setujui pengajuan?', `Akun ${t.dataset.e} dibuat sebagai admin pondok dan terikat ke pesantren ini. Pastikan email, nama admin, dan nama pondok sudah benar.`, 'Setujui dan aktifkan')) return;
        const r = await api('putuskanUndangan', { id_undangan: id, keputusan: 'setuju' }); toast(r.pesan); render();
      } else if (k === 'cabut') {
        if (!await konfirmasi('Cabut token?', 'Token ini tidak bisa dipakai lagi. Admin pondok perlu token baru.', 'Cabut token', true)) return;
        const r = await api('putuskanUndangan', { id_undangan: id, keputusan: 'cabut' }); toast(r.pesan); render();
      } else if (k === 'tolak') {
        const d = modal(`<div class="dlg-isi"><h2>Tolak pengajuan</h2><p>Tulis alasan agar admin pondok tahu apa yang perlu diperbaiki. Alasan ini tampil di halaman token mereka.</p><div class="fl" style="margin-top:10px"><label for="al-t">Alasan</label><textarea id="al-t" rows="3" maxlength="300"></textarea></div><div id="al-e" class="galat" style="display:none;margin:10px 0 0"></div></div>
          <div class="dlg-aksi"><button class="btn sek" data-x="0">Batal</button><button class="btn bahaya" data-x="1">Tolak pengajuan</button></div>`);
        d.addEventListener('click', async ev => {
          const x = ev.target.closest('[data-x]'); if (!x) return;
          if (x.dataset.x === '0') { d.close(); return; }
          try { const r = await api('putuskanUndangan', { id_undangan: id, keputusan: 'tolak', catatan: $('#al-t', d).value }); d.close(); toast(r.pesan); render(); }
          catch (er) { $('#al-e', d).textContent = er.message; $('#al-e', d).style.display = 'block'; }
        });
      }
    } catch (x) { if (!x.ditangani) toast(x.message, 'galat'); }
  });
}

const BAGIAN_CFG = [['identitas', 'Identitas'], ['tema', 'Tema'], ['header', 'Header & menu'], ['beranda', 'Beranda'], ['footer', 'Footer'], ['pengumuman', 'Pengumuman']];
const cfgGet = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);

    header: () => `<section class="form-seksi"><h2>Bilah atas</h2><div class="grid-form">
      <div class="fl">${cek('header.utilbar_tampil', 'Tampilkan bilah tipis di atas header')}</div><div></div>
      ${f('header.utilbar_teks', 'Teks pada bilah atas', { penuh: true, max: 120 })}</div></section>
      <section class="form-seksi"><h2>Menu utama</h2><div class="grid-form">
      <div class="fl">${cek('header.tampil_statistik', 'Tampilkan menu Statistik')}</div><div class="fl">${cek('header.tombol_ukuran', 'Tampilkan tombol pembesar teks (A− A A+)')}</div>
      <div class="fl penuh"><span class="lab">Menu tambahan (maksimal 6)</span><span class="hint">Tampil setelah Statistik. Alamat dapat berupa https://… atau halaman dalam aplikasi seperti #/direktori.</span></div>
      ${daftar('header.menu', 6, 'Tambah menu')}</div></section>`,
    beranda: () => `<section class="form-seksi"><h2>Bagian atas beranda</h2><div class="grid-form">
      ${f('beranda.hero_judul', 'Judul besar', { penuh: true, max: 120 })}
      ${f('beranda.hero_lead', 'Kalimat pengantar', { penuh: true, max: 240, hint: 'Boleh dikosongkan.' })}</div></section>
      <section class="form-seksi"><h2>Gambar latar bagian atas</h2><div class="grid-form">
      <div class="fl penuh"><div class="info kecil"><b>Panduan ukuran gambar</b><ul style="margin:6px 0 0;padding-left:1.2em"><li>Ukuran ideal <b>1920 × 700 piksel</b> (mendatar, perbandingan sekitar 11:4). Minimal 1600 × 600 piksel.</li><li>Format JPG atau WEBP agar ringan, usahakan di bawah 500 KB (maksimal 2 MB).</li><li>Pilih foto yang tidak terlalu ramai. Bagian kiri dipakai untuk judul dan kolom pencarian, bagian kanan untuk kotak angka. Pada layar lebar dan HP, sisi gambar bisa terpotong, jadi letakkan objek penting di tengah.</li><li>Gambar otomatis dibuat transparan di atas warna utama, tidak perlu diedit lebih dulu.</li></ul></div></div>
      ${aset('beranda.hero_gambar', 'Gambar latar')}
      <div class="fl"><label for="c_jelas">Kejelasan gambar</label><span class="hint">Makin kecil, makin samar dan makin aman untuk keterbacaan teks.</span><select id="c_jelas" data-p="beranda.hero_jelas">${[['15', 'Sangat samar (15%)'], ['25', 'Samar (25%)'], ['35', 'Sedang (35%)'], ['50', 'Jelas (50%)']].map(([v, t]) => `<option value="${v}" ${String(draf.beranda.hero_jelas) === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      </div></section>
      <section class="form-seksi"><h2>Bagian yang ditampilkan</h2><div class="grid-form">
      <div class="fl">${cek('beranda.tampil_cepat', 'Kotak tautan cepat')}</div><div class="fl">${cek('beranda.tampil_angka', 'Ringkasan angka')}</div>
      <div class="fl">${cek('beranda.tampil_sorotan', 'Pesantren dengan santri terbanyak')}</div><div class="fl">${cek('beranda.tampil_potret', 'Slide potret pesantren')}</div>
      </div></section>
      <section class="form-seksi"><h2>Slide potret pesantren</h2><div class="grid-form">
      ${f('beranda.potret_judul', 'Judul bagian', { max: 60 })}
      <div></div>
      ${f('beranda.potret_lede', 'Keterangan singkat', { area: 2, penuh: true, max: 160, hint: 'Tampil di bawah judul. Boleh dikosongkan.' })}
      <div class="fl penuh"><span class="lab">Sumber foto</span>${radio('beranda.potret_mode', 'pmode', [['gabung', 'Foto kustom, lalu foto dari pesantren'], ['kustom', 'Hanya foto kustom']])}</div>
      <div class="fl penuh"><span class="lab">Foto kustom <span class="muted kecil">(${(draf.beranda.potret_kustom || []).length} dari 8)</span></span>
        <span class="hint">Tambahkan foto sendiri, misalnya kegiatan LP2 PP. Ukuran ideal <b>1600 × 900 piksel</b> (16:9), JPG atau WEBP, maksimal 2 MB. Foto kustom tampil lebih dulu.</span>
        <div id="daftar-potret">${(draf.beranda.potret_kustom || []).map((it, i) => { const src = asetAman(it.gambar), P = `beranda.potret_kustom.${i}.gambar`; return `<div class="item-potret"><div class="contoh">${src ? `<img src="${esc(src)}" alt="" onerror="this.remove()">` : ''}</div><div class="kolom-potret">
          <div class="fl"><label for="pt_j${i}">Judul foto</label><input id="pt_j${i}" type="text" maxlength="80" data-l="beranda.potret_kustom" data-i="${i}" data-k="judul" value="${esc(it.judul || '')}"></div>
          <div class="fl"><label for="pt_u${i}">Tautan saat diklik (opsional)</label><input id="pt_u${i}" type="text" data-l="beranda.potret_kustom" data-i="${i}" data-k="url" value="${esc(it.url || '')}" placeholder="https://… atau #/direktori"></div>
          <div class="fl"><label for="pt_g${i}">Alamat gambar</label><input id="pt_g${i}" type="text" data-l="beranda.potret_kustom" data-i="${i}" data-k="gambar" value="${esc(it.gambar || '')}" placeholder="Unggah di samping, atau tempel tautan"></div>
          <div class="fl"><label for="pt_f${i}">Unggah dari komputer</label><input id="pt_f${i}" type="file" data-aset="${P}" accept="image/png,image/jpeg,image/webp"></div></div>
          <button class="btn bahaya kecil" type="button" data-hapus="beranda.potret_kustom" data-i="${i}">Hapus</button></div>`; }).join('') || '<p class="muted kecil">Belum ada foto kustom.</p>'}</div>
        ${(draf.beranda.potret_kustom || []).length < 8 ? '<div style="margin-top:10px"><button class="btn sek kecil" type="button" id="tambah-potret">Tambah foto</button></div>' : ''}</div>
      </div></section>
      <section class="form-seksi"><h2>Pesantren dengan santri terbanyak</h2><div class="grid-form">
      <div class="fl"><label for="c_kol">Kartu per baris</label><span class="hint">Berlaku di layar lebar. Di tablet dan HP otomatis 2 atau 1 kolom.</span><select id="c_kol" data-p="beranda.sorot_kolom">${[['2', '2 kartu (kelipatan 2)'], ['3', '3 kartu (bawaan, kelipatan 3)'], ['4', '4 kartu (kelipatan 4)']].map(([v, t]) => `<option value="${v}" ${String(draf.beranda.sorot_kolom || '3') === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="fl"><label for="c_jumlah">Jumlah pesantren pada sorotan</label><span class="hint">Selalu memenuhi baris penuh agar tampilan seimbang.</span><select id="c_jumlah" data-p="beranda.jumlah_sorotan">${[1, 2, 3].map(b => String(b * (parseInt(draf.beranda.sorot_kolom, 10) || 3))).map(n => `<option value="${n}" ${String(draf.beranda.jumlah_sorotan) === n ? 'selected' : ''}>${n} pesantren</option>`).join('')}</select></div>
      </div></section>`,
    footer: () => `<section class="form-seksi"><h2>Isi footer</h2><div class="grid-form">
      ${f('footer.deskripsi', 'Deskripsi', { area: 3, penuh: true, max: 400 })}
      ${f('footer.alamat', 'Alamat', { area: 2, penuh: true, max: 300 })}
      ${f('footer.email', 'Email', { tipe: 'email', max: 100 })}${f('footer.telepon', 'Telepon', { max: 60 })}
      ${f('footer.copyright', 'Nama pada hak cipta', { max: 120, hint: 'Tampil sebagai “© tahun nama”.' })}
      <div class="fl">${cek('footer.tampil_provinsi', 'Kolom provinsi terbanyak')}</div></div></section>
      <section class="form-seksi"><h2>Kolom tautan tambahan</h2><div class="grid-form">
      ${f('footer.kolom_judul', 'Judul kolom', { max: 30 })}<div></div>${daftar('footer.kolom_link', 6, 'Tambah tautan')}</div></section>
      <section class="form-seksi"><h2>Media sosial</h2><div class="grid-form">
      ${[['facebook', 'Facebook'], ['instagram', 'Instagram'], ['youtube', 'YouTube'], ['tiktok', 'TikTok'], ['x', 'X'], ['website', 'Situs web']].map(([k, n]) => f('footer.' + k, n, { tipe: 'url' })).join('')}
      </div></section>`,
    pengumuman: () => `<section class="form-seksi"><h2>Pengumuman di bagian paling atas</h2><div class="grid-form">
      <div class="fl penuh">${cek('pengumuman.tampil', 'Tampilkan pengumuman')}</div>
      ${f('pengumuman.teks', 'Teks pengumuman', { penuh: true, max: 200 })}
      ${f('pengumuman.link', 'Tautan “Selengkapnya”', { hint: 'Boleh dikosongkan.' })}
      <div class="fl"><label for="c_pw">Warna</label><select id="c_pw" data-p="pengumuman.warna">${[['emas', 'Aksen'], ['hijau', 'Warna utama'], ['merah', 'Merah'], ['biru', 'Biru']].map(([v, t]) => `<option value="${v}" ${draf.pengumuman.warna === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <p class="hint penuh" style="margin:0">Pengunjung dapat menutup pengumuman. Pengumuman muncul lagi jika teksnya diganti.</p></div></section>`
  };
  const upKontras = () => { const i = $('#info-kontras', el); if (!i) return; const u = warnaEfektif(draf.tema).u, k = kontras(u, '#ffffff'); i.textContent = k >= 4.5 ? `Kontras warna utama dengan teks putih ${k.toFixed(1)}:1 (baik).` : `Kontras warna utama dengan teks putih hanya ${k.toFixed(1)}:1. Pilih warna lebih gelap agar teks terbaca.`; i.style.color = k >= 4.5 ? 'var(--tinta2)' : 'var(--merah)'; };
  const gambar = () => { form.innerHTML = isi[bagian](); $$('#sub-tab button', el).forEach(b => b.setAttribute('aria-current', String(b.dataset.b === bagian))); upKontras(); };
  const terapkan = () => { S.cfg = gabung(CFG_BAWAAN, draf); S.cfgDraftAktif = true; terapkanConfig(); renderNav(); const beda = JSON.stringify(draf) !== JSON.stringify(gabung(CFG_BAWAAN, S.cfgServer)); $('#status-cfg').textContent = beda ? 'Ada perubahan yang belum disimpan.' : 'Belum ada perubahan.'; };
  gambar(); if (S.cfgDraftAktif) terapkan();
  $('#sub-tab', el).onclick = e => { const b = e.target.closest('[data-b]'); if (b) { bagian = S.bagianCfg = b.dataset.b; gambar(); } };

  const ubah = e => {
    const t = e.target;
    if (t.dataset.l) { const arr = cfgGet(draf, t.dataset.l), it = arr[+t.dataset.i]; it[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; terapkan(); return; }
    if (!t.dataset.p) return;
    if (t.type === 'radio' && !t.checked) return;
    if (t.type === 'file') return;
    let v = t.type === 'checkbox' ? t.checked : t.value;
    const p = t.dataset.p;
    if (p.indexOf('tema.warna') === 0) {
      if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
      v = v.toLowerCase();
      if (draf.tema.preset !== 'kustom') { const w = warnaEfektif(draf.tema); draf.tema.warna_utama = w.u; draf.tema.warna_aksen = w.a; draf.tema.warna_latar = w.l; draf.tema.preset = 'kustom'; }
      cfgSet(draf, p, v);
      $$(`[data-p="${p}"]`, form).forEach(x => { if (x !== t) x.value = v; });
      $$('.preset', form).forEach(x => x.setAttribute('aria-pressed', 'false'));
      upKontras();
    } else cfgSet(draf, p, v);
    if (p === 'beranda.sorot_kolom') { const k = parseInt(v, 10) || 3, j = parseInt(draf.beranda.jumlah_sorotan, 10) || 0; if (!j || j % k || j > k * 3) draf.beranda.jumlah_sorotan = String(k * 2); gambar(); }
    terapkan();
  };
  form.addEventListener('input', ubah); form.addEventListener('change', ubah);
  form.addEventListener('click', e => {
    const pr = e.target.closest('[data-preset]'), tb = e.target.closest('[data-tambah]'), hp = e.target.closest('[data-hapus]');
    if (pr) { const k = pr.dataset.preset, P = PRESET[k]; Object.assign(draf.tema, { preset: k, warna_utama: P.u, warna_aksen: P.a, warna_latar: P.l }); terapkan(); gambar(); }
    if (tb) { cfgGet(draf, tb.dataset.tambah).push({ label: '', url: '', baru: false }); gambar(); terapkan(); const ins = $$('input[data-k="label"]', form); if (ins.length) ins[ins.length - 1].focus(); }
    if (hp) { cfgGet(draf, hp.dataset.hapus).splice(+hp.dataset.i, 1); gambar(); terapkan(); }
    if (e.target.closest('#tambah-potret')) { const arr = draf.beranda.potret_kustom || (draf.beranda.potret_kustom = []); if (arr.length < 8) arr.push({ gambar: '', judul: '', url: '' }); gambar(); terapkan(); const ins = $$('input[data-k="judul"]', form); if (ins.length) ins[ins.length - 1].focus(); }
  });
  form.addEventListener('change', async e => {
    const inp = e.target.closest('[data-aset]'); if (!inp || !inp.files.length) return;
    const file = inp.files[0], p = inp.dataset.aset;
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { toast('Format harus PNG, JPG, atau WEBP.', 'galat'); return; }
    if (file.size > 2 * 1024 * 1024) { toast('Ukuran gambar maksimal 2 MB.', 'galat'); return; }
    inp.disabled = true; toast('Mengunggah gambar…');
    try { const data = await bacaBase64(file); const r = await api('uploadAsset', { mime: file.type, nama_file: file.name, data }); cfgSet(draf, p, r.url); if (r.peringatan) toast(r.peringatan, 'galat'); else toast('Gambar diunggah.'); gambar(); terapkan(); }
    catch (x) { if (!x.ditangani) toast(x.message, 'galat'); inp.disabled = false; }
  });

  $('#cfg-batal', el).onclick = () => { buangDraf(); renderNav(); S.draf = null; render(); };
  $('#cfg-lihat', el).onclick = () => { S.cfgDraftAktif = true; S.pratinjau = true; go('/'); };
  $('#cfg-reset', el).onclick = async () => {
    if (!await konfirmasi('Kembalikan ke bawaan?', 'Semua pengaturan tampilan kembali ke bawaan aplikasi, termasuk judul, warna, menu, dan footer.', 'Kembalikan', true)) return;
    try { await api('saveConfig', { config: {} }); S.cfgServer = {}; store.set('lp2pp.cfg', '{}'); buangDraf(); renderNav(); S.draf = null; toast('Pengaturan dikembalikan ke bawaan.'); render(); }
    catch (x) { if (!x.ditangani) toast(x.message, 'galat'); }
  };
  $('#cfg-simpan', el).onclick = async () => {
    if (!String(draf.situs.judul || '').trim()) { toast('Judul situs wajib diisi.', 'galat'); bagian = S.bagianCfg = 'identitas'; gambar(); return; }
    if (kontras(warnaEfektif(draf.tema).u, '#ffffff') < 4.5) { toast('Warna utama terlalu terang. Pilih warna yang lebih gelap agar teks putih terbaca.', 'galat'); bagian = S.bagianCfg = 'tema'; gambar(); return; }
    const b = $('#cfg-simpan', el); b.disabled = true; b.textContent = 'Menyimpan…';
    try {
      const r = await api('saveConfig', { config: draf });
      S.cfgServer = r.config; store.set('lp2pp.cfg', JSON.stringify(r.config));
      S.cfgDraftAktif = false; S.pratinjau = false; S.draf = null; S.cfg = gabung(CFG_BAWAAN, S.cfgServer); terapkanConfig(); renderNav();
      toast('Pengaturan situs disimpan.'); render();
    } catch (x) { if (!x.ditangani) toast(x.message, 'galat'); b.disabled = false; b.textContent = 'Simpan pengaturan'; }
  };
}

const JENIS_ISIAN = [['teks', 'Teks pendek'], ['teks_panjang', 'Teks panjang (paragraf)'], ['angka', 'Angka bulat'], ['desimal', 'Angka desimal'], ['tahun', 'Tahun'], ['ya_tidak', 'Ya / Tidak'], ['sudah_belum', 'Sudah / Belum'], ['pilihan', 'Pilihan (satu jawaban)'], ['multi', 'Pilihan ganda'], ['email', 'Email'], ['url', 'Tautan'], ['telp', 'Nomor telepon']];
const NAMA_JENIS = Object.fromEntries(JENIS_ISIAN);
const IK_NAIK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';
const IK_TURUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

async function pageIsian({ el, ok }) {
  if (!perluStaf(el)) return;
  const kepala = `<div class="wrap"><div class="judul-hal"><h1 style="font-size:clamp(1.5rem,3vw,2.1rem)">Kelola isian</h1></div>${tabPanel('/panel/isian')}`;
  if (S.user.role !== 'superadmin') { el.innerHTML = kepala + '<div class="galat">Kelola isian khusus super admin.</div></div>'; return; }
  document.title = 'Kelola isian — ' + judulSitus();
  el.innerHTML = muat();
  let K = await api('kelolaIsian'); if (!ok()) return;
  let daftar = [], terbuka = new Set(), cari = '';
  const ringkas = c => ({ tampil: c.tampil || '', petunjuk: c.petunjuk || '', seksi: c.seksi, satuan: c.satuan || '', wajib: !!c.wajib, vis: c.vis, editor: c.editor, aktif: !!c.aktif, urutan: Number(c.urutan) });
  const muatData = () => { daftar = K.kolom.map((c, i) => Object.assign({}, c, { _i: i, _awal: JSON.stringify(ringkas(c)) })); };
  const berubah = c => JSON.stringify(ringkas(c)) !== c._awal;
  const urut = () => daftar.slice().sort((a, b) => (Number(a.urutan) - Number(b.urutan)) || (a._i - b._i));
  const judulBawaan = c => label(Object.assign({}, c, { tampil: '', label: c.asli }));
  const judulEf = c => c.tampil || judulBawaan(c);
  const kelompok = () => { const g = []; urut().forEach(c => { let x = g.find(y => y.nama === c.seksi); if (!x) { x = { nama: c.seksi, isi: [] }; g.push(x); } x.isi.push(c); }); return g; };

  const rowHtml = (c, pos, total) => {
    const buka = terbuka.has(c.kolom), inti = c.inti, id = 'ik_' + c.kolom;
    const chips = [inti ? '<span class="chip" title="Dipakai langsung oleh pencarian, statistik, atau peringatan data. Judul boleh diganti, tidak bisa disembunyikan.">Isian inti</span>' : '', c.kustom ? '<span class="chip">Tambahan</span>' : '', !c.aktif ? '<span class="chip merah">Disembunyikan</span>' : ''].join('');
    return `<li class="isian${c.aktif ? '' : ' mati'}" data-k="${esc(c.kolom)}">
      <div class="isian-utama">
        <div class="fl isian-judul"><label for="${id}_j">Judul di form</label><input id="${id}_j" type="text" data-f="tampil" maxlength="120" value="${esc(judulEf(c))}"></div>
        <div class="isian-aksi">
          <button class="ikon" type="button" data-aksi="naik" aria-label="Naikkan ${esc(judulEf(c))}" ${pos === 0 ? 'disabled' : ''}>${IK_NAIK}</button>
          <button class="ikon" type="button" data-aksi="turun" aria-label="Turunkan ${esc(judulEf(c))}" ${pos === total - 1 ? 'disabled' : ''}>${IK_TURUN}</button>
          <label class="saklar"><input type="checkbox" data-f="aktif" ${c.aktif ? 'checked' : ''} ${inti ? 'disabled' : ''}><span>Tampil</span></label>
          <button class="btn sek kecil" type="button" data-aksi="rinci" aria-expanded="${buka}">${buka ? 'Tutup' : 'Rincian'}</button>
        </div>
      </div>
      <div class="isian-info"><span>${esc(NAMA_JENIS[c.tipe] || c.tipe)}</span><span>Terisi di ${ang(c.terisi)} dari ${ang(K.total)} pesantren</span>${chips}${!c.aktif ? '<span>Data lama tetap tersimpan.</span>' : ''}</div>
      <div class="isian-rinci" ${buka ? '' : 'hidden'}>
        <div class="fl penuh"><label for="${id}_p">Petunjuk di bawah isian</label><input id="${id}_p" type="text" data-f="petunjuk" maxlength="200" value="${esc(c.petunjuk || HINT[c.kolom] || '')}" placeholder="Boleh dikosongkan"></div>
        <div class="fl"><label for="${id}_s">Bagian</label><input id="${id}_s" type="text" data-f="seksi" list="dl-seksi" maxlength="40" value="${esc(c.seksi)}"><span class="hint">Pilih bagian yang ada atau tulis nama bagian baru.</span></div>
        <div class="fl"><label for="${id}_u">Satuan</label><input id="${id}_u" type="text" data-f="satuan" maxlength="20" value="${esc(c.satuan)}" placeholder="Contoh: orang, ha"></div>
        <div class="cek penuh">
          <label class="saklar"><input type="checkbox" data-f="wajib" ${c.wajib ? 'checked' : ''} ${inti ? 'disabled' : ''}><span>Wajib diisi</span></label>
          <label class="saklar"><input type="checkbox" data-f="vis" ${c.vis === 'publik' ? 'checked' : ''} ${inti ? 'disabled' : ''}><span>Tampil di profil publik</span></label>
        </div>
        <div class="fl"><label for="${id}_e">Yang mengisi</label><select id="${id}_e" data-f="editor" ${inti ? 'disabled' : ''}><option value="admin_pondok" ${c.editor === 'admin_pondok' ? 'selected' : ''}>Admin pondok</option><option value="operator" ${c.editor === 'operator' ? 'selected' : ''}>Hanya operator LP2 PP</option></select></div>
        <p class="isian-catatan penuh">Judul asli di formulir: ${esc(c.asli)}<br>${inti ? 'Isian inti: pengaturan tampil, wajib, publik, dan pengisi dikunci karena dipakai langsung oleh pencarian dan statistik.' : 'Menyembunyikan tidak menghapus data. Data lama tetap ada dan muncul lagi bila isian ditampilkan kembali.'}</p>
      </div>
    </li>`;
  };

  const gambar = () => {
    const q = cari.trim().toLowerCase(), g = kelompok(), ub = daftar.filter(berubah).length;
    const wadah = $('#isian-wadah', el);
    wadah.innerHTML = g.map(k => {
      const tampil = k.isi.map((c, i) => [c, i]).filter(([c]) => !q || (judulEf(c) + ' ' + c.asli + ' ' + c.kolom).toLowerCase().includes(q));
      if (!tampil.length) return '';
      return `<section class="isian-seksi"><h2>${esc(k.nama)} <small>${k.isi.length} isian</small></h2><ul class="isian-daftar">${tampil.map(([c, i]) => rowHtml(c, i, k.isi.length)).join('')}</ul></section>`;
    }).join('') || '<p class="muted">Tidak ada isian yang cocok.</p>';
    $('#dl-seksi', el).innerHTML = g.map(k => `<option value="${esc(k.nama)}">`).join('');
    $('#status-isian', el).textContent = ub ? `${ub} isian diubah, belum disimpan.` : 'Belum ada perubahan.';
    $('#isian-simpan', el).disabled = !ub; $('#isian-batal', el).disabled = !ub;
  };
  const status = () => { const ub = daftar.filter(berubah).length; $('#status-isian', el).textContent = ub ? `${ub} isian diubah, belum disimpan.` : 'Belum ada perubahan.'; $('#isian-simpan', el).disabled = !ub; $('#isian-batal', el).disabled = !ub; };

  const opsiSeksi = () => kelompok().map(k => k.nama);
  const gambarHal = () => {
    muatData();
    el.innerHTML = kepala + `
      <p class="muted" style="max-width:72ch">Ubah judul dan petunjuk isian, atur urutannya, sembunyikan isian yang tidak dipakai, atau tambah isian baru. Isian tidak bisa dihapus agar riwayat data pesantren tetap utuh. Perubahan berlaku untuk form admin pondok dan halaman profil, dan setiap perubahan tercatat di Riwayat perubahan.</p>
      <div class="info" style="margin:14px 0;max-width:72ch">Isian bertanda <b>Isian inti</b> dipakai langsung oleh pencarian, statistik, dan peringatan data, jadi judulnya boleh diganti tetapi tidak bisa disembunyikan. ${ang(K.sistem)} kolom sistem (nomor ID, status, waktu ubah) tidak ditampilkan di sini.</div>
      <details class="isian-tambah" id="blok-tambah"><summary>Tambah isian baru</summary>
        <form id="form-tambah" class="grid-form" novalidate>
          <div class="fl penuh"><label for="t-judul">Judul isian <span class="wajib">*</span></label><input id="t-judul" type="text" maxlength="120" autocomplete="off" placeholder="Contoh: Jumlah ruang kelas"></div>
          <div class="fl"><label for="t-jenis">Jenis isian <span class="wajib">*</span></label><select id="t-jenis">${JENIS_ISIAN.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select><span class="hint">Jenis tidak bisa diubah setelah ditambahkan.</span></div>
          <div class="fl"><label for="t-seksi">Bagian <span class="wajib">*</span></label><input id="t-seksi" type="text" list="dl-seksi" maxlength="40" autocomplete="off" placeholder="Pilih atau tulis bagian baru"></div>
          <div class="fl penuh" id="t-pilihan-wadah" hidden><label for="t-pilihan">Pilihan jawaban <span class="wajib">*</span></label><textarea id="t-pilihan" rows="4" placeholder="Satu pilihan per baris, minimal dua"></textarea><span class="hint" id="t-pilihan-hint"></span></div>
          <div class="fl"><label for="t-satuan">Satuan</label><input id="t-satuan" type="text" maxlength="20" placeholder="Contoh: orang, ruang (boleh kosong)"></div>
          <div class="fl"><label for="t-petunjuk">Petunjuk pengisian</label><input id="t-petunjuk" type="text" maxlength="200" placeholder="Boleh dikosongkan"></div>
          <div class="fl"><label for="t-editor">Yang mengisi</label><select id="t-editor"><option value="admin_pondok">Admin pondok</option><option value="operator">Hanya operator LP2 PP</option></select></div>
          <div class="cek penuh" style="display:flex;gap:18px;flex-wrap:wrap">
            <label class="saklar"><input type="checkbox" id="t-wajib"><span>Wajib diisi</span></label>
            <label class="saklar"><input type="checkbox" id="t-vis"><span>Tampil di profil publik</span></label>
          </div>
          <p class="isian-catatan penuh">Isian baru tidak tampil di publik kecuali Anda mencentangnya. Kuota isian tambahan: <b>${K.jumlah_kustom}</b> dari ${K.maks_kustom} terpakai.</p>
          <div class="penuh"><button class="btn" type="submit" id="t-kirim">Tambahkan isian</button></div>
        </form>
      </details>
      <div class="isian-bantu"><div class="fl cari-isian"><label class="sr" for="isian-cari">Cari isian</label><input id="isian-cari" type="search" placeholder="Cari isian…" autocomplete="off"></div><span class="muted">${ang(K.kolom.length)} isian dapat diatur</span></div>
      <datalist id="dl-seksi"></datalist>
      <div id="isian-wadah"></div>
      <div class="bar-simpan"><div class="wrap"><span class="status" id="status-isian">Belum ada perubahan.</span>
        <button class="btn sek" type="button" id="isian-batal" disabled>Batalkan perubahan</button>
        <button class="btn" type="button" id="isian-simpan" disabled>Simpan perubahan</button></div></div></div>`;
    gambar();
    pasangEvent();
  };

  const cariItem = e => { const li = e.target.closest('li.isian'); return li ? daftar.find(c => c.kolom === li.dataset.k) : null; };
  const pasangEvent = () => {
    const wadah = $('#isian-wadah', el);
    wadah.addEventListener('input', e => {
      const c = cariItem(e), f = e.target.dataset.f; if (!c || !f || e.target.type === 'checkbox' || e.target.tagName === 'SELECT') return;
      if (f === 'tampil') c.tampil = e.target.value.trim() === judulBawaan(c) ? '' : e.target.value;
      else if (f === 'petunjuk') c.petunjuk = e.target.value;
      else if (f === 'seksi') c.seksi = e.target.value;
      else if (f === 'satuan') c.satuan = e.target.value;
      status();
    });
    wadah.addEventListener('change', e => {
      const c = cariItem(e), f = e.target.dataset.f; if (!c || !f) return;
      if (f === 'aktif') c.aktif = e.target.checked;
      else if (f === 'wajib') c.wajib = e.target.checked;
      else if (f === 'vis') c.vis = e.target.checked ? 'publik' : 'terbatas';
      else if (f === 'editor') c.editor = e.target.value;
      else if (f === 'seksi') { c.seksi = e.target.value.trim() || c.seksi; }
      else return;
      const y = scrollY; gambar(); scrollTo(0, y);
    });
    wadah.addEventListener('click', e => {
      const b = e.target.closest('[data-aksi]'); if (!b) return;
      const c = cariItem(e); if (!c) return;
      if (b.dataset.aksi === 'rinci') { terbuka.has(c.kolom) ? terbuka.delete(c.kolom) : terbuka.add(c.kolom); const li = b.closest('li'), r = $('.isian-rinci', li); r.hidden = !terbuka.has(c.kolom); b.textContent = r.hidden ? 'Rincian' : 'Tutup'; b.setAttribute('aria-expanded', String(!r.hidden)); return; }
      const grup = urut().filter(x => x.seksi === c.seksi), i = grup.indexOf(c), t = grup[i + (b.dataset.aksi === 'naik' ? -1 : 1)];
      if (!t) return;
      let a = Number(c.urutan), z = Number(t.urutan);
      if (a === z) z = a + (b.dataset.aksi === 'naik' ? -0.5 : 0.5);
      c.urutan = z; t.urutan = a;
      const y = scrollY; gambar(); scrollTo(0, y);
      const ulang = $(`li[data-k="${c.kolom}"] [data-aksi="${b.dataset.aksi}"]`, el); if (ulang && !ulang.disabled) ulang.focus(); else { const lain = $(`li[data-k="${c.kolom}"] .ikon:not(:disabled)`, el); if (lain) lain.focus(); }
    });
  };

  gambarHal();
  const ubahJenis = () => {
    const j = $('#t-jenis', el).value, w = $('#t-pilihan-wadah', el);
    w.hidden = !['pilihan', 'multi'].includes(j);
    $('#t-pilihan-hint', el).textContent = j === 'multi' ? 'Jangan memakai tanda koma di dalam satu pilihan.' : '';
  };
  el.onchange = e => { if (e.target.id === 't-jenis') ubahJenis(); };
  el.oninput = e => { if (e.target.id === 'isian-cari') { cari = e.target.value; gambar(); } };
  el.onsubmit = async e => {
    if (e.target.id !== 'form-tambah') return;
    e.preventDefault();
    const v = id => $('#' + id, el).value.trim();
    const jenis = v('t-jenis');
    const data = { tampil: v('t-judul'), tipe: jenis, seksi: v('t-seksi'), satuan: v('t-satuan'), petunjuk: v('t-petunjuk'), editor: $('#t-editor', el).value, wajib: $('#t-wajib', el).checked, vis: $('#t-vis', el).checked ? 'publik' : 'terbatas' };
    if (['pilihan', 'multi'].includes(jenis)) data.pilihan = $('#t-pilihan', el).value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!data.tampil) { toast('Judul isian wajib diisi.', 'galat'); $('#t-judul', el).focus(); return; }
    if (!data.seksi) { toast('Pilih atau tulis nama bagian.', 'galat'); $('#t-seksi', el).focus(); return; }
    const b = $('#t-kirim', el); b.disabled = true; b.textContent = 'Menambahkan…';
    try {
      await api('tambahIsian', data); S.pubMeta = null; S.authMeta = null;
      toast('Isian ditambahkan.'); K = await api('kelolaIsian'); if (!ok()) return; gambarHal();
    } catch (x) { if (!x.ditangani) toast(x.message, 'galat'); b.disabled = false; b.textContent = 'Tambahkan isian'; }
  };
  el.onclick = async e => {
    if (e.target.id === 'isian-batal') { muatData(); const y = scrollY; gambar(); scrollTo(0, y); return; }
    if (e.target.id !== 'isian-simpan') return;
    const ubah = daftar.filter(berubah);
    for (const c of ubah) {
      if (!String(c.seksi || '').trim()) { toast(`Bagian untuk "${judulEf(c)}" tidak boleh kosong.`, 'galat'); return; }
      if (String(c.seksi).trim().toLowerCase() === 'sistem') { toast('Nama bagian "Sistem" dipakai khusus oleh sistem.', 'galat'); return; }
    }
    const b = e.target; b.disabled = true; b.textContent = 'Menyimpan…';
    try {
      const r = await api('simpanIsian', { items: ubah.map(c => ({ kolom: c.kolom, tampil: c.tampil, petunjuk: c.petunjuk, seksi: String(c.seksi).trim(), satuan: c.satuan, wajib: !!c.wajib, vis: c.vis, editor: c.editor, aktif: !!c.aktif, urutan: Number(c.urutan) })) });
      S.pubMeta = null; S.authMeta = null;
      toast(r.pesan || 'Tersimpan.'); K = await api('kelolaIsian'); if (!ok()) return; const y = scrollY; gambarHal(); scrollTo(0, y);
    } catch (x) { if (!x.ditangani) toast(x.message, 'galat'); b.disabled = false; b.textContent = 'Simpan perubahan'; }
  };
}

muatSesi();
pasangSkala();
(async () => {
  let cache = null;
  try { cache = JSON.parse(store.get('lp2pp.cfg') || 'null'); } catch (e) { cache = null; }
  if (cache) {
    S.cfgServer = cache; S.cfg = gabung(CFG_BAWAAN, cache); terapkanConfig(); renderNav(); render();
    if (await muatCfg()) { renderNav(); render(); }
  } else {
    terapkanConfig();
    let selesai = false, berubah = false;
    const p = muatCfg().then(u => { selesai = true; berubah = u; return u; });
    await Promise.race([p, new Promise(r => setTimeout(r, 1500))]);
    renderNav(); render();
    if (!selesai) { await p; if (berubah && !S.cfgDraftAktif) { renderNav(); render(); } }
  }
  // tombol gulir cepat: panah naik bila sudah turun, panah turun bila masih di atas
  (function () {
    const b = document.getElementById('gulir'); if (!b) return;
    const doc = document.documentElement;
    let arah = 'turun', tick = false;
    const hitung = () => {
      tick = false;
      const maks = doc.scrollHeight - innerHeight, y = scrollY;
      if (maks < innerHeight * 0.6) { b.classList.remove('ada'); return; }
      arah = (y > maks * 0.45 || y > 600) ? 'naik' : 'turun';
      const t = arah === 'naik' ? 'Gulir ke atas' : 'Gulir ke bawah';
      b.classList.add('ada'); b.classList.toggle('turun', arah === 'turun');
      b.setAttribute('aria-label', t); b.title = t;
    };
    const minta = () => { if (!tick) { tick = true; requestAnimationFrame(hitung); } };
    addEventListener('scroll', minta, { passive: true });
    addEventListener('resize', minta);
    addEventListener('hashchange', () => setTimeout(minta, 350));
    new MutationObserver(minta).observe(document.getElementById('utama'), { childList: true, subtree: true });
    b.addEventListener('click', () => {
      const maks = doc.scrollHeight - innerHeight;
      scrollTo({ top: arah === 'naik' ? 0 : maks, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' });
    });
    minta();
  })();
})();
</script>
</body>
</html>
