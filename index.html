<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Pesantren Muhammadiyah</title>
<meta name="description" id="meta-desc" content="Direktori dan basis data pesantren Muhammadiyah se-Indonesia, dikelola LP2 PP Muhammadiyah.">
<meta name="theme-color" content="#0d3a2c" id="meta-tema">
<link rel="icon" type="image/png" href="warna.png" id="ikon-situs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --h900:#0d3a2c; --h800:#124a38; --h700:#1a5f48; --h600:#26775b; --h500:#3f8f71; --h300:#8fbca7; --h200:#c9ddd2; --h100:#e4eee8; --h50:#f0f5f2;
  --kertas:#f5f7f4; --putih:#ffffff; --tinta:#14211b; --tinta2:#43534b; --tinta3:#56655d;
  --garis:#d3dbd5; --garis2:#e5eae6;
  --emas:#d6a21f; --emas-tua:#8a6508; --emas-bg:#fbf1d2;
  --merah:#a8392b; --merah-bg:#f8e3df; --biru:#2b5d86; --biru-bg:#e2edf6;
  --r:6px;--r2:8px;--r3:10px;--on-emas:#14211b;--emas-hover:#e6b436;
  --judul:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --isi:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:calc(112.5% * var(--skala,1))}
body{margin:0;background:var(--kertas);color:var(--tinta);font:400 1rem/1.6 var(--isi);min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
h1,h2,h3{font-family:var(--judul);line-height:1.15;margin:0;color:var(--h900);font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.6vw,3rem)}
h2{font-size:clamp(1.3rem,2.6vw,1.65rem)}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--h700);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--h900)}
:focus-visible{outline:3px solid var(--emas);outline-offset:2px;border-radius:3px}
.wrap{width:100%;max-width:1600px;margin:0 auto;padding:0 clamp(16px,2.6vw,40px)}
.muted{color:var(--tinta3)}
.kecil{font-size:.875rem}
.skip{position:absolute;left:-999px;top:0;background:var(--emas);color:var(--tinta);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* bilah atas */
.topbar{background:#fff;color:var(--tinta);border-bottom:3px solid var(--h900)}
.topbar .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--h900);text-decoration:none;font:700 1.05rem/1.1 var(--judul);margin-right:auto}
.brand:hover{color:var(--h900)}
.brand:focus:not(:focus-visible){outline:0}
.logo-kotak{flex:none;width:54px;height:54px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo-kotak img{width:100%;height:100%;object-fit:contain;transform:scale(1.45);display:block}
.brand small{display:block;font:400 .85rem/1.2 var(--isi);color:var(--tinta3);letter-spacing:0}
.nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nav a,.nav .linkbtn{color:var(--tinta2);text-decoration:none;padding:8px 12px;border-radius:var(--r);font-size:.95rem;background:none;border:0;cursor:pointer;font-family:inherit}
.nav a:hover,.nav .linkbtn:hover{background:var(--h50);color:var(--h900)}
.nav a[aria-current="page"]{background:var(--h100);color:var(--h900);font-weight:600}
.nav .masuk{background:var(--emas);color:var(--on-emas);font-weight:600}
.nav .masuk:hover{background:var(--emas-hover);color:var(--on-emas)}
.akun-info{color:var(--tinta3);font-size:.9rem;padding:0 8px}

/* tombol & isian */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--h800);color:#fff;border:1px solid var(--h800);padding:10px 18px;border-radius:var(--r);font:600 .95rem/1.2 var(--isi);cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{background:var(--h900);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sek{background:var(--putih);color:var(--h800);border-color:var(--h300)}
.btn.sek:hover{background:var(--h50);color:var(--h900)}
.btn.emas{background:var(--emas);border-color:var(--emas);color:var(--on-emas)}
.btn.emas:hover{background:var(--emas-hover);color:var(--on-emas)}
.btn.bahaya{background:var(--putih);color:var(--merah);border-color:#d9a8a0}
.btn.bahaya:hover{background:var(--merah-bg);color:var(--merah)}
.btn.kecil{padding:6px 12px;min-height:34px;font-size:.9rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=url],input[type=tel],select,textarea{
  width:100%;background:var(--putih);border:1px solid #b9c5bd;border-radius:var(--r);padding:9px 11px;font:400 1rem/1.4 var(--isi);color:var(--tinta);min-height:42px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--emas);outline-offset:0;border-color:var(--h700)}
input[readonly],input:disabled,select:disabled,textarea:disabled{background:var(--h50);color:var(--tinta2)}
.fl{display:flex;flex-direction:column;gap:5px;min-width:0}
.fl>label,.fl>.lab{font-weight:600;font-size:.92rem;color:var(--tinta)}
.fl .hint{font-size:.875rem;color:var(--tinta3);line-height:1.35}
.fl .err{font-size:.9rem;color:var(--merah);font-weight:600}
.fl.salah input,.fl.salah select,.fl.salah textarea{border-color:var(--merah);background:#fffafa}
.wajib{color:var(--merah);margin-left:2px}
.sufiks{display:flex;align-items:stretch}
.sufiks input{border-top-right-radius:0;border-bottom-right-radius:0}
.sufiks span{display:flex;align-items:center;padding:0 12px;background:var(--h50);border:1px solid #b9c5bd;border-left:0;border-radius:0 6px 6px 0;color:var(--tinta2);font-size:.9rem}
.pilih-multi{display:flex;flex-wrap:wrap;gap:8px}
.pilih-multi label{display:flex;align-items:center;gap:8px;border:1px solid #b9c5bd;background:var(--putih);border-radius:var(--r);padding:8px 12px;cursor:pointer;font-weight:400;min-height:42px}
.pilih-multi label:has(input:checked){background:var(--h100);border-color:var(--h600)}
.pilih-multi input{width:18px;height:18px;accent-color:var(--h700)}

/* beranda */
.hero{padding-top:44px;padding-bottom:28px}
.hero h1{max-width:18ch}
.hero-band h1{text-wrap:balance;hyphens:manual}
.hero-band h1 .tb{white-space:nowrap}
.lead{font-size:1.15rem;color:var(--tinta2);margin-top:14px;max-width:56ch}
.cari{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:10px;margin-top:26px;max-width:860px}
.cari input,.cari select{min-height:48px}
.cari .btn{min-height:48px}
.angka{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:34px 0 0;border-top:2px solid var(--h900)}
.angka div{padding:14px 18px 6px 0}
.angka div+div{padding-left:18px;border-left:1px solid var(--garis)}
.angka dt{font-size:.9rem;color:var(--tinta2);order:2}
.angka dd{margin:0;font:700 clamp(1.7rem,3.4vw,2.4rem)/1.05 var(--judul);color:var(--h900);font-variant-numeric:tabular-nums}
.angka div{display:flex;flex-direction:column}
.bagian{padding:34px 0 8px}
.bagian>.wrap>p.muted{margin-top:6px;max-width:64ch}
.rak-bungkus{margin-top:22px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.rak{display:flex;align-items:flex-end;min-width:max-content;border-bottom:0}
.spine{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:34px;flex:none;text-decoration:none;color:var(--tinta);position:relative}
.spine .n{font:600 .875rem/1 var(--isi);margin-bottom:4px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.spine .bar{width:22px;background:var(--h700);border-radius:3px 3px 0 0;transition:background .15s}
.spine.t2 .bar{background:var(--h900)}
.spine.t0 .bar{background:var(--garis);height:3px!important}
.spine.t0 .n{color:var(--tinta3);font-weight:400}
.spine .alas{height:9px;width:100%;background:var(--h900)}
.spine .nm{writing-mode:vertical-rl;transform:rotate(180deg);height:124px;margin-top:8px;font-size:.875rem;white-space:nowrap;color:var(--tinta2);text-align:end}
.spine:hover .bar,.spine:focus-visible .bar{background:var(--emas)}
.spine:hover .nm{color:var(--tinta);font-weight:600}
.dua-kolom{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px}
.peringkat{list-style:none;margin:16px 0 0;padding:0;counter-reset:r}
.peringkat li{counter-increment:r;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--garis2)}
.peringkat li::before{content:counter(r);font:700 .95rem var(--judul);color:var(--h600);font-variant-numeric:tabular-nums}
.peringkat .sub{display:block;font-size:.9rem;color:var(--tinta3)}
.peringkat .v{font-weight:700;font-variant-numeric:tabular-nums}
.kartu-grafik{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r3);padding:22px 24px 24px;display:flex;flex-direction:column}
.kartu-grafik h2{font-size:1.2rem;margin:0 0 4px}
.kartu-grafik>p{margin:0 0 4px}
.batang2{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:14px}
.b-atas{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:5px;font-size:.93rem}
.b-nilai{white-space:nowrap;font-variant-numeric:tabular-nums}
.b-nilai b{font-weight:700}
.b-nilai small,.l-nilai small{color:var(--tinta3);margin-left:7px;font-size:.85rem}
.b-trek{height:10px;background:var(--h100);border-radius:99px;overflow:hidden}
.b-trek i{display:block;height:100%;background:var(--h700);border-radius:99px}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:14px;flex:1;justify-content:center}
.donut{position:relative;width:min(210px,100%);aspect-ratio:1}
.donut svg{width:100%;height:100%;display:block;transform:rotate(0deg)}
.irisan{transition:opacity .15s,stroke-width .15s}
.donut.fokus .irisan{opacity:.3}.donut.fokus .irisan.aktif{opacity:1;stroke-width:7.6}
.donut-tengah{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut-tengah b{font:700 1.7rem/1.1 var(--judul);font-variant-numeric:tabular-nums}
.donut-tengah small{color:var(--tinta3);font-size:.85rem}
.legenda{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.legenda li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.93rem;padding:3px 6px;border-radius:var(--r)}
.legenda li:hover{background:var(--h50)}
.legenda i{width:14px;height:14px;border-radius:4px;display:block}
.l-nilai{white-space:nowrap;font-variant-numeric:tabular-nums}
.batang{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:9px}
.batang li{display:grid;grid-template-columns:minmax(0,10.5rem) minmax(0,1fr) 3.4rem;gap:12px;align-items:center;font-size:.93rem}
.batang .tr{height:12px;background:var(--h100);border-radius:2px;overflow:hidden}
.batang .tr i{display:block;height:100%;background:var(--h600)}
.batang .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* direktori */
.judul-hal{padding:34px 0 18px}
.filter{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;padding:16px 0;border-top:1px solid var(--garis);border-bottom:1px solid var(--garis)}
.hasil-info{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0 6px;color:var(--tinta2);font-size:.95rem}
.daftar{list-style:none;margin:0;padding:0}
.baris{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.5fr) 7.5rem;gap:18px;padding:15px 0;border-bottom:1px solid var(--garis2);align-items:start}
.baris .nama{font:700 1.05rem/1.25 var(--judul);color:var(--h900);text-decoration:none}
.baris .nama:hover{text-decoration:underline}
.baris .lok{font-size:.9rem;color:var(--tinta2);margin-top:3px}
.baris .santri{text-align:right;font-variant-numeric:tabular-nums}
.baris .santri b{display:block;font:700 1.15rem var(--judul)}
.baris .santri span{font-size:.875rem;color:var(--tinta3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;background:var(--h100);color:var(--h800);border-radius:999px;padding:2px 10px;font-size:.875rem;font-weight:600;max-width:100%;overflow-wrap:anywhere}
.chip.emas{background:var(--emas-bg);color:var(--emas-tua)}
.chip.abu{background:#e9eeea;color:var(--tinta2)}
.chip.merah{background:var(--merah-bg);color:var(--merah)}
.chip.biru{background:var(--biru-bg);color:var(--biru)}
.halaman{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:22px 0 8px}
.halaman a,.halaman span{min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--garis);background:var(--putih);border-radius:var(--r);text-decoration:none;color:var(--tinta);padding:0 10px;font-weight:600}
.halaman a:hover{background:var(--h50)}
.halaman .aktif{background:var(--h800);color:#fff;border-color:var(--h800)}
.halaman .mati{color:var(--tinta3);background:transparent;border-color:transparent;font-weight:400}

/* profil */
.kepala-profil{padding:30px 0 20px;border-bottom:1px solid var(--garis)}
.kepala-profil .remah{font-size:.9rem;margin-bottom:12px}
.kepala-profil h1{font-size:clamp(1.6rem,3.6vw,2.4rem);max-width:30ch}
.kepala-profil .lok{margin-top:8px;color:var(--tinta2);font-size:1.05rem}
.aksi{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.profil{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:44px;padding:28px 0 40px}
.profil aside{display:flex;flex-direction:column;gap:22px}
.galeri{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.galeri a{display:block;aspect-ratio:4/3;background:var(--h100);border-radius:var(--r);overflow:hidden;border:1px solid var(--garis)}
.galeri a:first-child{grid-column:1/-1;aspect-ratio:16/10}
.galeri img{width:100%;height:100%;object-fit:cover;display:block}
.sekilas{display:grid;gap:0;margin:0;border-top:2px solid var(--h900)}
.sekilas div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--garis2);font-size:.95rem}
.sekilas dt{color:var(--tinta2)}
.sekilas dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.seksi{margin-bottom:34px}
.seksi>h2{font-size:1.25rem;padding-bottom:8px;border-bottom:2px solid var(--h900);margin-bottom:4px}
.bidang{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);gap:4px 24px;padding:10px 0;border-bottom:1px solid var(--garis2)}
.bidang dt{color:var(--tinta2);font-size:.93rem}
.bidang dd{margin:0;overflow-wrap:anywhere}
.bidang.teks-penuh{grid-template-columns:1fr;gap:6px}
.bidang dd.teks{max-width:78ch;line-height:1.75;text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.teks-rapi p{margin:0 0 .85em}
.teks-rapi>:last-child{margin-bottom:0}
.teks-rapi ul,.teks-rapi ol{margin:0 0 .85em;padding-left:1.6em}
.teks-rapi li{margin:0 0 .45em;padding-left:.2em}
.teks-rapi li::marker{color:var(--h700);font-weight:700}
.teks-rapi p.pembuka{font-weight:600}
.bidang .kosong{color:var(--tinta3);font-style:italic}
.bidang .tag{font-size:.85rem;background:var(--emas-bg);color:var(--emas-tua);padding:1px 7px;border-radius:999px;margin-left:6px;font-weight:600;white-space:nowrap}
.verif{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--h50);border:1px solid var(--h200);border-radius:var(--r2);padding:12px 14px}
.verif .st{font-weight:700}
.peringatan{background:var(--emas-bg);border:1px solid #ead08a;border-left:5px solid var(--emas);border-radius:var(--r);padding:12px 14px;color:#4d3a05}
.peringatan ul{margin:6px 0 0 18px;padding:0}
.p-daftar{display:grid;gap:10px;margin-top:8px}
.p-item{padding-top:10px;border-top:1px solid #ead08a}
.p-item:first-child{padding-top:0;border-top:0}
.p-judul{font-weight:600}
.p-baris{margin:4px 0 4px;padding-left:12px;border-left:3px solid var(--emas)}
.p-saran{font-size:.92rem}
.galat{background:var(--merah-bg);border:1px solid #e3b6ae;border-left:5px solid var(--merah);border-radius:var(--r);padding:14px 16px;color:#5c1d14;margin:24px 0}
.info{background:var(--biru-bg);border:1px solid #b8d0e4;border-left:5px solid var(--biru);border-radius:var(--r);padding:12px 14px;color:#173a58}
.kosong-hal{padding:50px 0;text-align:center;color:var(--tinta2)}
.muat{padding:60px 0;text-align:center;color:var(--tinta3)}
.muat::before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border:3px solid var(--h200);border-top-color:var(--h700);border-radius:50%;animation:putar .8s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}

/* formulir */
.form-seksi{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r2);margin-bottom:18px}
.form-seksi>h2{font-size:1.1rem;padding:14px 18px;border-bottom:1px solid var(--garis2);background:var(--h50);border-radius:var(--r2) 8px 0 0}
.grid-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;padding:18px}
.grid-form .penuh{grid-column:1/-1}
/* form ubah: kotak rata (subgrid) dan pembatas seksi yang tegas */
.grid-form.rapi{align-items:start}
.grid-form.rapi .fl{display:grid;grid-template-rows:subgrid;grid-row:span 3;row-gap:6px;gap:6px}
.grid-form.rapi .fl>.ctl{min-width:0}
.grid-form.rapi .fl>.cat{display:flex;flex-direction:column;gap:3px;min-width:0}
.grid-form.rapi .fl>.cat:empty{display:none}
@supports not (grid-template-rows:subgrid){.grid-form.rapi .fl{display:flex;flex-direction:column;grid-row:auto}}
.grid-form.rapi input:not([type=checkbox]),.grid-form.rapi select,.grid-form.rapi textarea{width:100%}
.seksi-tegas{border:2px solid var(--h900);border-radius:var(--r2);margin-bottom:30px;overflow:hidden;box-shadow:0 10px 24px rgba(13,58,44,.10);scroll-margin-top:16px}
.seksi-tegas>h2{background:var(--h900);color:#fff;font-size:1.15rem;padding:13px 20px;border:0;border-radius:0;display:flex;align-items:center;gap:12px}
.seksi-tegas>h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--emas);flex:none}
.seksi-tegas .grid-form{padding:22px 20px;background:var(--putih)}
.lompat{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.lompat button{font:inherit;font-weight:600;font-size:.9rem;background:var(--putih);color:var(--h900);border:1.5px solid var(--h900);border-radius:999px;padding:6px 14px;cursor:pointer}
.lompat button:hover,.lompat button:focus-visible{background:var(--h900);color:#fff}
.und-item{border:1px solid var(--garis);border-radius:var(--r2);padding:14px 16px;background:var(--putih);display:grid;gap:8px}
.und-item.perlu{border:2px solid var(--emas);background:var(--emas-bg)}
.und-kepala{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.und-kepala b{margin-right:auto}
.und-data{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.95rem}
.und-data dt{color:var(--tinta2)}.und-data dd{margin:0;overflow-wrap:anywhere}
.und-data .beda{color:var(--merah);font-weight:700}
.und-aksi{display:flex;gap:8px;flex-wrap:wrap}
.tokenbox{font:700 clamp(1.4rem,5vw,1.9rem)/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-align:center}
/* peta sebaran */
.peta-grid{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(300px,1fr);gap:24px;margin-top:18px;align-items:stretch}
.peta-kartu,.peta-panel{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r3);padding:16px}
.peta-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.peta-seg{display:inline-flex;border:1.5px solid var(--h900);border-radius:999px;overflow:hidden}
.peta-seg button{font:inherit;font-weight:600;padding:7px 18px;background:#fff;color:var(--h900);border:0;cursor:pointer}
.peta-seg button[aria-pressed=true]{background:var(--h900);color:#fff}
.peta-bar select{max-width:260px}
.peta-kartu{display:flex;flex-direction:column}
.peta-kanvas{position:relative;background:var(--h50);border-radius:var(--r2);overflow:hidden;flex:1;display:flex;align-items:center}
#peta-gulir{width:100%}
.pp-daftar.gulir{max-height:440px;overflow-y:auto;padding-right:4px}
.peta-kanvas svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.peta-kanvas svg.geser{touch-action:none;cursor:grab}
.pv{stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .3s}
.pv.b0{fill:#dde5df}.pv.b1{fill:color-mix(in srgb,var(--h900) 22%,#fff)}.pv.b2{fill:color-mix(in srgb,var(--h900) 45%,#fff)}.pv.b3{fill:color-mix(in srgb,var(--h900) 70%,#fff)}.pv.b4{fill:var(--h900)}
.pv.hov{stroke:var(--emas);stroke-width:2.2}
.pv.sel{stroke:var(--emas);stroke-width:3}
.pv-hit{fill:transparent;stroke:rgba(13,26,20,.5);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.peta-zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.peta-zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--garis);background:#fff;color:var(--h900);font:700 1.2rem/1 var(--isi);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.peta-zoom button:hover,.peta-zoom button:focus-visible{background:var(--h900);color:#fff}
.peta-tip{position:absolute;pointer-events:none;background:var(--h900);color:#fff;padding:7px 11px;border-radius:8px;font-size:.92rem;line-height:1.35;white-space:nowrap;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.peta-tip[hidden]{display:none}
.peta-legenda{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:.9rem;color:var(--tinta2)}
.peta-legenda span{display:inline-flex;align-items:center;gap:6px}
.peta-legenda i{width:18px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.peta-panel h3{font-size:1.25rem;margin-bottom:4px}
.pp-angka{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--garis);border:1px solid var(--garis);border-radius:var(--r2);overflow:hidden;margin:14px 0}
.pp-angka div{background:#fff;padding:12px 14px;display:flex;flex-direction:column-reverse;gap:2px}
.pp-angka dd{margin:0;font:700 1.6rem/1.1 var(--judul);color:var(--h900);font-variant-numeric:tabular-nums}
.pp-angka dt{font-size:.9rem;color:var(--tinta2)}
.pp-aksi{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pp-daftar{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.pp-baris{display:grid;grid-template-columns:1.8em minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer}
.pp-baris:hover,.pp-baris:focus-visible,.pp-baris.hov{background:var(--h50)}
.pp-baris .no{color:var(--tinta3);font-variant-numeric:tabular-nums}
.pp-baris .n{font-weight:700;font-variant-numeric:tabular-nums}
.pp-baris .garis{grid-column:2/4;height:6px;border-radius:3px;background:#e6ece8;overflow:hidden}
.pp-baris .garis b{display:block;height:100%;background:var(--h900);border-radius:3px}
.peta-kredit{margin-top:14px}
@media (max-width:900px){.peta-grid{grid-template-columns:minmax(0,1fr)}.peta-bar select{max-width:none;flex:1}}
@media (max-width:700px){.peta-kartu{padding:12px}.peta-bar{flex-direction:column;align-items:stretch;gap:10px}.peta-seg{display:flex}.peta-seg button{flex:1;padding:8px 10px;font-size:.92rem;white-space:nowrap}.peta-bar select{width:100%;max-width:none;flex:none}.peta-zoom{top:auto;bottom:8px;right:8px;grid-auto-flow:column}.peta-zoom button{width:40px;height:40px}}
@media (prefers-reduced-motion:reduce){.pv{transition:none}}
.bar-simpan{position:sticky;bottom:0;background:rgba(245,247,244,.96);border-top:1px solid var(--garis);padding:12px 0;margin-top:10px;z-index:5;backdrop-filter:blur(4px)}
.bar-simpan .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar-simpan .status{margin-right:auto;color:var(--tinta2);font-size:.92rem}
.lencana{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;font-weight:700;font-size:.9rem;border:1px solid var(--garis);background:#fff;color:var(--tinta2)}
.lencana::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.lencana.draf{background:var(--emas-bg);color:var(--emas-tua);border-color:#ead08a}
.lencana.offline{background:#fdecec;color:#9b1c1c;border-color:#f0b8b8}
.lencana.aman{background:var(--h100);color:var(--h800);border-color:var(--h200,var(--garis))}
.draf-atas{position:sticky;top:0;z-index:6;margin:0 0 16px;padding:10px 14px;background:var(--emas-bg);border:1px solid #ead08a;border-left:5px solid var(--emas);border-radius:var(--r);color:#4d3a05;font-size:.95rem}
.draf-atas.offline{background:#fdecec;border-color:#f0b8b8;border-left-color:#c0392b;color:#7a1515}
.draf-atas[hidden]{display:none}
.fl.berubah{border-left:4px solid var(--emas);padding-left:10px}
.fl.berubah>label::after,.fl.berubah>.lab::after{content:"Draf, belum disimpan";margin-left:8px;font-size:.8rem;font-weight:700;background:var(--emas-bg);color:var(--emas-tua);padding:1px 8px;border-radius:999px;white-space:nowrap}
.berkas-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.berkas-list li{display:flex;align-items:center;gap:12px;border:1px solid var(--garis2);border-radius:var(--r);padding:8px 10px;background:var(--kertas)}
.berkas-list img{width:64px;height:48px;object-fit:cover;border-radius:4px;background:var(--h100)}
.berkas-list .ikon{width:64px;height:48px;border-radius:4px;background:var(--h100);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--h700);font-size:.875rem}
.berkas-list .info-b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}

/* tabel panel */
.tabel-bungkus{overflow-x:auto;border:1px solid var(--garis);border-radius:var(--r2);background:var(--putih)}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-weight:700;padding:10px 12px;background:var(--h50);border-bottom:1px solid var(--garis);white-space:nowrap;color:var(--h900)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--garis2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .nowrap{white-space:nowrap}
.tbl .potong{max-width:280px;overflow-wrap:anywhere}
.tab-panel{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--garis);margin-bottom:20px}
.tab-panel a{padding:10px 16px;text-decoration:none;color:var(--tinta2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab-panel a[aria-current="page"]{color:var(--h900);border-bottom-color:var(--emas)}
.ringkas-panel{display:flex;gap:0;flex-wrap:wrap;margin:0 0 20px;border-top:2px solid var(--h900)}
.ringkas-panel a{flex:1 1 140px;padding:12px 16px 8px 0;text-decoration:none;color:var(--tinta)}
.ringkas-panel a+a{padding-left:16px;border-left:1px solid var(--garis)}
.ringkas-panel b{display:block;font:700 1.7rem/1.1 var(--judul);color:var(--h900);font-variant-numeric:tabular-nums}
.ringkas-panel span{font-size:.88rem;color:var(--tinta2)}
.ringkas-panel a:hover b{color:var(--h600)}
.kartu-login{max-width:440px;margin:44px auto;background:var(--putih);border:1px solid var(--garis);border-radius:var(--r3);padding:28px}
.kartu-login form{display:grid;gap:16px;margin-top:18px}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;background:var(--putih);border:1px solid var(--h300);border-radius:var(--r);z-index:20;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(13,58,44,.14)}
.ac-list div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--garis2);font-size:.93rem}
.ac-list div:hover,.ac-list div[aria-selected="true"]{background:var(--h50)}
.ac-list small{color:var(--tinta3)}


.rv-list{list-style:none;margin:0;padding:0;border-top:2px solid var(--h900)}
.rv{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,1.7fr) auto;gap:10px 22px;padding:14px 0;border-bottom:1px solid var(--garis2);align-items:start}
.rv-pes a{font:700 1rem/1.25 var(--judul);color:var(--h900)}
.rv-kol{font-weight:600;margin-bottom:6px}
.rv-nilai{display:flex;gap:22px;margin:0;flex-wrap:wrap}
.rv-nilai dt{font-size:.875rem;color:var(--tinta3)}
.rv-nilai dd{margin:0;overflow-wrap:anywhere}
.rv-ket p{margin:6px 0 0;color:var(--tinta2);line-height:1.4}
.rv-aksi{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:1000px){.rv{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rv-aksi{justify-content:flex-start;grid-column:1/-1}}
@media (max-width:640px){.rv{grid-template-columns:1fr}}

/* struktur ala portal kampus: bilah utilitas, navigasi utama, hero, tautan cepat */
.utilbar{background:var(--h900);color:var(--h200);font-size:.875rem}
.utilbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:6px 18px;min-height:36px;flex-wrap:wrap}
#util{display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap}
.utilbar a,.utilbar button{color:#e4eee8;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:4px 0}
.utilbar a:hover,.utilbar button:hover{color:#fff;text-decoration:underline}
.utilbar :focus-visible{outline-color:#fff}
.topbar{position:relative;z-index:30}
.topbar .wrap{position:relative;flex-wrap:nowrap}
.nav{flex-wrap:nowrap}
.nav>a,.nav .dd-btn{white-space:nowrap}
.dd{position:static}
.dd-btn{display:inline-flex;align-items:center;gap:7px}
.dd-btn::after{content:"";width:7px;height:7px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-3px;transition:transform .15s}
.dd-btn[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:3px}
.dd-btn[aria-current="page"]{background:var(--h100)!important;color:var(--h900)!important;font-weight:600}
.dd-panel{position:absolute;right:20px;top:100%;width:min(700px,calc(100% - 40px));background:var(--putih);border:1px solid var(--garis);border-top:3px solid var(--emas);border-radius:0 0 8px 8px;box-shadow:0 18px 40px rgba(13,58,44,.18);padding:20px 24px;display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:24px}
.dd-panel[hidden]{display:none}
.dd-panel h3{font-size:.95rem;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--garis2)}
.dd-panel a{display:block;padding:5px 0;color:var(--tinta2);text-decoration:none;font-size:.93rem;border-radius:0;background:none}
.dd-panel a:hover{color:var(--h900);background:none;text-decoration:underline}
.burger{display:none;width:44px;height:44px;border:1px solid var(--garis);background:var(--putih);border-radius:var(--r);cursor:pointer;padding:0;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.burger i{display:block;width:20px;height:2px;background:var(--h900)}
.hero-band{background:var(--h900);color:#fff;padding:46px 0 92px;position:relative;overflow:hidden;isolation:isolate}
.hero-band.ada-gambar::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--hero-img) center/cover no-repeat;opacity:var(--hero-op,.35)}
.hero-band.ada-gambar .hero-sekilas>div,.hero-band.ada-gambar .hero-sekilas .lanjut{background:rgba(8,28,21,.45)}
.hero-band.ada-gambar::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 70%)}
.hero-band h1{color:#fff;max-width:24ch}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
.hero-sekilas{display:none}

  .hero-sekilas>div{background:rgba(255,255,255,.07);padding:24px 26px;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px}
  .hero-sekilas dd{margin:0;font:700 clamp(1.6rem,2.2vw,2.5rem)/1.1 var(--judul);color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hero-sekilas dt{color:var(--h200);font-size:.95rem}
  .hero-sekilas .lanjut{grid-column:1/-1;background:rgba(255,255,255,.07);padding:14px 26px}

  .angka-sempit{display:none}
}

.hero-band .cari input:hover,.hero-band .cari select:hover,.hero-band .cari input:focus,.hero-band .cari select:focus{background:#fff;border-color:#fff;color:var(--tinta,#1b2b22)}
.hero-band .cari input:hover::placeholder,.hero-band .cari input:focus::placeholder{color:#6b7a72}
.hero-band .cari .btn{min-height:44px;padding:8px 16px;gap:7px;opacity:.88}
.hero-band .cari .btn svg{width:17px;height:17px;flex:none}
.hero-band .cari:hover .btn,.hero-band .cari:focus-within .btn{opacity:1}
.hero-band .btn{background:var(--emas);border-color:var(--emas);color:var(--on-emas)}
.hero-band .btn:hover{background:var(--emas-hover);color:var(--on-emas)}
.judul-bagian{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.judul-bagian a{font-weight:600;font-size:.93rem}
.fakta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:20px 0 0;border-top:2px solid var(--h900)}
.fakta div{padding:16px 18px 14px 0;border-bottom:1px solid var(--garis);min-width:0;display:flex;flex-direction:column}
.fakta div:not(:nth-child(4n+1)){padding-left:18px;border-left:1px solid var(--garis)}
.fakta dt{order:2;font-size:.9rem;color:var(--tinta2)}
.fakta dd{margin:0;min-width:0;overflow-wrap:anywhere;font:700 clamp(1.3rem,3vw,2.1rem)/1.1 var(--judul);color:var(--h900);font-variant-numeric:tabular-nums}
.sorot-grid{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(var(--kol,3),minmax(0,1fr));gap:20px}
.sorot{display:flex;flex-direction:column;height:100%;background:var(--putih);border:1px solid var(--garis);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--tinta)}

.sorot-foto{aspect-ratio:16/9;background:var(--h100);position:relative;display:flex;align-items:center;justify-content:center;font:700 2.6rem var(--judul);color:var(--h300)}
.sorot-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sorot-isi{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}

.foot-atas a{display:block;color:var(--h200);text-decoration:none;padding:3px 0}
.foot-atas a:hover{color:#fff;text-decoration:underline}
.foot-atas p{color:var(--h200);line-height:1.5;max-width:34ch}
.foot-kontak{margin-top:12px;display:grid;gap:2px}

.foot-sosial-blok{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18)}
.foot-atas .foot-sosial-blok h3{color:#fff;font-size:.95rem;margin:0 0 10px;font-weight:600}
.foot-sosial{display:flex;flex-wrap:wrap;gap:10px}
.foot-atas .foot-sosial a{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.4);border-radius:50%;color:#fff;transition:background .15s,color .15s,border-color .15s}
.foot-atas .foot-sosial a:hover{background:#fff;color:var(--h900);border-color:#fff;text-decoration:none}
.foot-atas .foot-sosial a:focus-visible{outline:3px solid var(--emas);outline-offset:2px}

@media (max-width:1000px){.foot-atas{grid-template-columns:1fr 1fr!important}}

.foot-bawah{border-top:1px solid rgba(255,255,255,.18);padding:14px 0;font-size:.9rem;color:var(--h300)}

@media (max-width:1000px){

  .nav{display:none;width:100%;flex-direction:column;align-items:stretch;gap:2px;padding:6px 0 10px;border-top:1px solid var(--garis2)}

}
@media (max-width:640px){

.slider{position:relative;margin-top:20px;border-radius:var(--r2);overflow:hidden;background:var(--h900)}
.slider-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slider-track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;scroll-snap-align:start;aspect-ratio:21/8;display:block;text-decoration:none;color:#fff;background:var(--h800)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide-info{position:absolute;left:0;right:0;bottom:0;padding:44px 64px 18px;background:linear-gradient(to top,rgba(13,36,28,.82),rgba(13,36,28,0));display:flex;flex-direction:column;gap:2px}
.slide-info b{font:700 1.15rem/1.25 var(--judul)}
.slide-info small{font-size:.9rem;color:#dbe8e0}
.slide:hover .slide-info b{text-decoration:underline}
.slider-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.slider-btn[hidden]{display:none}
.slider-btn:hover{background:#fff}
.slider-btn::before{content:"";width:10px;height:10px;border:solid var(--h900);border-width:0 0 3px 3px}
.slider-btn.prev{left:12px}.slider-btn.prev::before{transform:rotate(45deg);margin-left:4px}
.slider-btn.next{right:12px}.slider-btn.next::before{transform:rotate(-135deg);margin-right:4px}
.slider-dots{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.slider-dots button{width:28px;height:28px;border:0;background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.slider-dots button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--h300)}
.slider-dots button[aria-current="true"]::before{background:var(--h800);width:22px;border-radius:5px}
@media (max-width:640px){.slide{aspect-ratio:4/3}.slide-info{padding:36px 16px 14px}.slider-btn{width:38px;height:38px}}

.akordion-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
details.seksi{margin-bottom:10px;border:1px solid var(--garis);border-radius:var(--r2);background:var(--putih)}
details.seksi>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;font:700 1.1rem/1.2 var(--judul);color:var(--h900);border-radius:var(--r2)}
details.seksi>summary::-webkit-details-marker{display:none}
details.seksi>summary:hover{background:var(--h50)}
details.seksi>summary .terisi{margin-left:auto;font:400 .875rem var(--isi);color:var(--tinta3)}
details.seksi>summary::after{content:"";flex:none;width:9px;height:9px;border:solid var(--h700);border-width:0 2px 2px 0;transform:rotate(45deg);margin:-3px 4px 0 6px;transition:transform .15s}
details.seksi[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
details.seksi[open]>summary{border-bottom:1px solid var(--garis2);border-radius:var(--r2) 8px 0 0}
details.seksi>dl{margin:0;padding:2px 18px 8px}
details.seksi .bidang:last-child{border-bottom:0}
@media (max-width:640px){details.seksi>summary .terisi{display:none}}

/* pengumuman, header berwarna, pengaturan situs */

body.hdr-warna .topbar{background:var(--h900);border-bottom:3px solid var(--emas)}

.tab-panel button{padding:10px 16px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--tinta2);font:600 1rem var(--isi);cursor:pointer}

.cek{display:flex;align-items:center;gap:10px;border:1px solid #b9c5bd;background:var(--putih);border-radius:var(--r);padding:9px 12px;cursor:pointer;min-height:42px}
.cek input{width:18px;height:18px;accent-color:var(--h700)}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.preset{border:2px solid var(--garis);background:var(--putih);border-radius:var(--r2);padding:10px;cursor:pointer;text-align:left;font:600 .92rem var(--isi);color:var(--tinta)}
.preset[aria-pressed="true"]{border-color:var(--h700);box-shadow:0 0 0 2px var(--h200)}
.preset i{display:flex;height:30px;border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.preset i b{flex:1}
.warna-baris{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.warna-isi{display:flex;gap:8px}
.warna-isi input[type=color]{width:52px;min-height:42px;padding:2px;flex:none;cursor:pointer}
.pratinjau{border:1px dashed var(--garis);border-radius:var(--r2);padding:18px;background:var(--kertas)}
.pratinjau h3{font-size:1.3rem;margin-bottom:6px}
.pratinjau .baris-p{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.daftar-edit{display:grid;gap:10px}
.item-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto auto;gap:10px;align-items:center}
.logo-edit{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo-edit .contoh{width:64px;height:64px;border:1px solid var(--garis);border-radius:var(--r);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.logo-edit .contoh img{max-width:100%;max-height:100%}
.logo-edit .fl{flex:1;min-width:220px}
.pratinjau-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#14211b;color:#fff;padding:10px 0;box-shadow:0 -6px 20px rgba(0,0,0,.25)}
.pratinjau-bar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.segar{min-width:40px;height:40px;padding:0 8px;font-weight:700;font-size:1.15rem;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center}

.info-data{display:inline-flex;gap:6px;flex-wrap:wrap}
@media print{.info-data{display:none}}
.ukuran{display:flex;gap:2px;align-items:center;margin-left:6px;padding-left:10px;border-left:1px solid var(--garis)}

@media (max-width:1000px){.ukuran{margin:6px 0 0;padding:6px 0 0;border-left:0;border-top:1px solid var(--garis2)}}
/* dialog & toast */
dialog.dlg{border:0;border-radius:var(--r3);padding:0;max-width:min(520px,92vw);width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--tinta)}

.dlg-isi{padding:22px 24px}
.dlg-isi h2{font-size:1.2rem;margin-bottom:10px}

.rahasia{font:600 1.35rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;background:var(--emas-bg);border:1px dashed var(--emas);padding:12px 14px;border-radius:var(--r);margin:12px 0;word-break:break-all;user-select:all}
#gulir{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:90;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.35);background:rgba(15,60,40,.38);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .25s,transform .25s,visibility .25s,background-color .2s}

#gulir.ada:hover,#gulir.ada:focus-visible{opacity:1;background:var(--h800)}

#gulir.turun svg{transform:rotate(180deg)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(440px,92vw);pointer-events:none}
.toast{background:var(--h900);color:#fff;padding:12px 16px;border-radius:var(--r2);box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto;font-size:.95rem}
.toast.galat-t{background:var(--merah)}
footer{background:var(--h900);color:var(--h200);margin-top:48px;font-size:.92rem}
footer a{color:#fff}

}

  .hero-band .cari .fl:first-child{grid-column:1/-1}
  .grid-form{grid-template-columns:1fr}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{

  @page{size:A4;margin:20mm 18mm 22mm;@bottom-center{content:"Halaman " counter(page) " dari " counter(pages);font:9pt sans-serif;color:#666}}
  html,body{background:#fff!important}
  body{font-size:10.5pt;line-height:1.5;color:#000}
  .pengumuman,.pratinjau-bar,.utilbar,.topbar,footer,.aksi,.verif,#toast,.noprint,.bar-simpan,.skip,.akordion-bar,.peringatan{display:none!important}
  .wrap{max-width:none;padding:0}
  .kepala-profil{padding:0 0 12px;border-bottom:2px solid var(--h900)}
  .kepala-profil .remah{display:none}
  .kepala-profil h1{font-size:20pt;max-width:none}
  .cetak-judul{display:flex!important;align-items:center;margin-bottom:10px}
  .profil{display:block;padding:14px 0 0}
  .profil aside{display:block;margin-bottom:16px}
  .galeri{grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .galeri a:first-child{grid-column:auto;aspect-ratio:4/3}
  .galeri a:nth-child(n+4){display:none}
  .sekilas{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;border-top:1.5px solid var(--h900)}
  details.seksi{border:0;border-radius:0;margin:0 0 16px;background:none;break-inside:auto}
  details.seksi>summary{padding:0 0 4px;border-bottom:1.5px solid var(--h900);border-radius:0;font-size:12.5pt;break-after:avoid}
  details.seksi>summary::after,details.seksi>summary .terisi{display:none}
  details.seksi>dl{padding:0}
  .bidang{grid-template-columns:42mm 1fr;gap:2px 14px;padding:5px 0;break-inside:avoid}
  .bidang dd.teks{max-width:none}
  .bidang.teks-penuh{grid-template-columns:1fr}
  .chip{border:1px solid #999;background:none;color:#000}
  a{color:inherit;text-decoration:none}
  .cetak-kaki{display:block!important;margin-top:18px;padding-top:8px;border-top:1px solid #bbb;font-size:8.5pt;color:#555}
}
#cetak-dilarang{display:none}

  body:not(.boleh-cetak)>*:not(#cetak-dilarang){display:none!important}
  body:not(.boleh-cetak) #cetak-dilarang{display:block!important;padding:40mm 10mm;text-align:center;font:14pt sans-serif;color:#000}
  body.boleh-cetak #cetak-dilarang{display:none!important}
}
.cetak-kaki{display:none}
.cetak-judul{display:none;font:700 .9rem var(--judul);color:var(--h700);margin-bottom:6px}/* pintasan beranda: satu panel dengan sekat, bukan deretan kartu */

.pintas li{background:var(--putih);min-width:0}

.pintas .ik svg{width:21px;height:21px;display:block}
.pintas a:hover .ik{background:var(--h800);color:#fff}
.pintas .tk{min-width:0;display:flex;flex-direction:column;gap:2px}

/* potret pesantren: pita warna penuh, teks di kiri, foto lebar di kanan */
.potret-band{background:var(--h900);color:#fff;margin-top:56px;padding:56px 0 60px;border-top:4px solid var(--emas);position:relative;overflow:hidden}
.potret-band::before{content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,0) 70%);pointer-events:none}
.potret-band[hidden]{display:none}
.potret-band .slider-dots{display:none}
.potret-grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);grid-template-areas:"teks" "slider" "ctrl";position:relative}
.potret-teks{grid-area:teks}.potret-band .slider{grid-area:slider}.potret-ctrl{grid-area:ctrl}
.potret-teks h2{color:#fff;font-size:clamp(1.5rem,2.6vw,2.1rem);margin:0 0 10px}
.potret-teks p{color:var(--h200);margin:0;max-width:36ch;line-height:1.55}
.potret-band .slider{margin-top:0;background:rgba(0,0,0,.25);border-radius:var(--r3);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.potret-band .slide{aspect-ratio:16/9}
.potret-band .slide-info{padding:60px 28px 22px}
.potret-ctrl{display:flex;align-items:center;gap:10px}
.pc-btn{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background-color .18s,color .18s,border-color .18s}
.pc-btn svg{width:20px;height:20px}
.pc-btn:hover{background:#fff;color:var(--h900);border-color:#fff}
.pc-btn[hidden]{display:none}
.pc-hitung{margin-left:8px;color:var(--h200);font-variant-numeric:tabular-nums;font-size:.95rem}
@media (min-width:1000px){
  .potret-grid{grid-template-columns:minmax(240px,.72fr) minmax(0,2.28fr);grid-template-areas:"teks slider" "ctrl slider";column-gap:52px;row-gap:26px;align-items:start}
  .potret-teks{align-self:end}.potret-ctrl{align-self:start}
}
@media (max-width:640px){.potret-band{padding:40px 0 44px;margin-top:40px}.potret-band .slide-info{padding:44px 16px 14px}.potret-band .slide-info b{font-size:1rem}}
.item-potret{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:start;padding:12px;border:1px solid var(--garis);border-radius:var(--r);background:var(--kertas);margin-bottom:10px}
.item-potret .contoh{width:96px;height:64px;border:1px solid var(--garis);border-radius:var(--r);background:var(--h100);overflow:hidden;display:flex;align-items:center;justify-content:center}

.item-potret .kolom-potret{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.item-potret .kolom-potret .fl.penuh{grid-column:1/-1}
@media (max-width:700px){.item-potret{grid-template-columns:1fr}.item-potret .kolom-potret{grid-template-columns:1fr}}


/* KELOLA ISIAN */
.isian-bantu{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}

.isian-tambah>summary::-webkit-details-marker{display:none}
.isian-tambah>summary::before{content:"+";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--h800);color:#fff;font:700 1rem/1 var(--isi)}

.isian-daftar{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.isian-utama{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:end}

.isian-aksi .ikon:hover:not(:disabled){background:var(--h50)}
.isian-aksi .ikon:disabled{opacity:.35;cursor:default}
.isian-aksi .ikon svg{width:16px;height:16px}
.saklar{display:inline-flex;align-items:center;gap:7px;font-size:.92rem;cursor:pointer;white-space:nowrap}
.saklar input{width:18px;height:18px;accent-color:var(--h700)}

function pasangPeta(root, provs) {
  const svg = $('#peta-svg', root), kanvas = $('#peta-kanvas', root), tip = $('#peta-tip', root), panel = $('#peta-panel', root), pil = $('#peta-pilih', root);
  if (!svg) return;
  const data = {}; provs.forEach(p => { data[p.nama] = p; });
  const nama = Object.keys(PETA.p);
  const tot = { jumlah: provs.reduce((a, p) => a + p.jumlah, 0), santri: provs.reduce((a, p) => a + (p.santri || 0), 0) };
  const BIN = { jumlah: [1, 5, 15, 40], santri: [1, 500, 2000, 10000] };
  const LABEL = { jumlah: ['0', '1–4', '5–14', '15–39', '40 atau lebih'], santri: ['0', '1–499', '500–1.999', '2.000–9.999', '10.000 atau lebih'] };
  const SAT = { jumlah: 'pesantren', santri: 'santri' };
  let metrik = 'jumlah', pilih = '', semua = false;
  const nilai = (n, m) => ((data[n] || {})[m || metrik]) || 0;
  const bin = v => { if (v <= 0) return 0; const t = BIN[metrik]; let b = 1; for (let i = 1; i < t.length; i++) if (v >= t[i]) b = i + 1; return b; };
  const urut = () => nama.slice().sort((a, b) => nilai(b) - nilai(a) || a.localeCompare(b, 'id'));
  const paths = {}; $$('.pv', svg).forEach(p => { paths[p.dataset.n] = p; });
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- warna & legenda ---- */
  function warna() {
    nama.forEach(n => { const p = paths[n]; if (!p) return; for (let i = 0; i < 5; i++) p.classList.remove('b' + i); p.classList.add('b' + bin(nilai(n))); });
    const sw = ['#dde5df', 'color-mix(in srgb,var(--h900) 22%,#fff)', 'color-mix(in srgb,var(--h900) 45%,#fff)', 'color-mix(in srgb,var(--h900) 70%,#fff)', 'var(--h900)'];
    $('#peta-legenda', root).innerHTML = `<b>${metrik === 'jumlah' ? 'Pesantren' : 'Santri'}:</b>` + sw.map((c, i) => `<span><i style="background:${c}"></i>${LABEL[metrik][i]}</span>`).join('');
    $$('[data-m]', root).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === metrik)));
  }

  /* ---- zoom & geser ---- */
  let vb = { x: 0, y: 0, w: PETA.w, h: PETA.h }, anim = 0;
  const pasangVB = () => { svg.setAttribute('viewBox', `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`); svg.classList.toggle('geser', vb.w < PETA.w * 0.98); };
  const jepit = v => { v.w = Math.min(PETA.w, Math.max(80, v.w)); v.h = v.w * PETA.h / PETA.w; v.x = Math.min(PETA.w - v.w + 20, Math.max(-20, v.x)); v.y = Math.min(PETA.h - v.h + 20, Math.max(-20, v.y)); return v; };

      vb = { x: a.x + (t.x - a.x) * e, y: a.y + (t.y - a.y) * e, w: a.w + (t.w - a.w) * e, h: a.h + (t.h - a.h) * e }; pasangVB(); if (k < 1) anim = requestAnimationFrame(langkah); };

function pasangSlider() {
  const tr = $('#slider-track'), dots = $('#slider-dots'); if (!tr) return;
  const slides = () => $$('.slide', tr);
  const idx = () => Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
  const pergi = i => { const n = slides().length; if (!n) return; i = (i + n) % n; tr.scrollTo({ left: i * tr.clientWidth, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' }); };
  const gambarDots = () => { const n = slides().length, c = idx(); dots.innerHTML = n > 1 ? slides().map((_, i) => `<button type="button" data-i="${i}" aria-label="Foto ${i + 1} dari ${n}" ${i === c ? 'aria-current="true"' : ''}></button>`).join('') : ''; $('#sl-prev').hidden = $('#sl-next').hidden = n < 2; const h = $('#sl-hitung'); if (h) h.textContent = n > 1 ? `${c + 1} / ${n}` : ''; };
  $('#sl-prev').onclick = () => pergi(idx() - 1);
  $('#sl-next').onclick = () => pergi(idx() + 1);
  dots.onclick = e => { const b = e.target.closest('[data-i]'); if (b) pergi(+b.dataset.i); };
  let raf = 0;
  tr.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const c = idx(); $$('button', dots).forEach((b, i) => { if (i === c) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); }); const h = $('#sl-hitung'), n = slides().length; if (h) h.textContent = n > 1 ? `${c + 1} / ${n}` : ''; }); });
  tr.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { e.preventDefault(); pergi(idx() + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); pergi(idx() - 1); } });
  const box = $('#slider'); let jeda = false;
  ['mouseenter', 'focusin', 'touchstart'].forEach(ev => box.addEventListener(ev, () => { jeda = true; }, { passive: true }));
  ['mouseleave', 'focusout'].forEach(ev => box.addEventListener(ev, () => { jeda = false; }));
  clearInterval(sliderTimer);
  if (!matchMedia('(prefers-reduced-motion:reduce)').matches) sliderTimer = setInterval(() => { if (!jeda && !document.hidden && slides().length > 1) pergi(idx() + 1); }, 5000);
  return gambarDots;
}

async function muatFotoSorotan(sorot, ok) {

  });

  const batas = kustom.length + (mode === 'kustom' ? 0 : 8);
  const urut = new Map();

function paginasi(basePath, q, halaman, total) {
  if (total <= 1) return '';
  const link = (p, t, cls) => `<a href="#${basePath}${qs(Object.assign({}, q, { halaman: p }))}" ${cls ? 'class="' + cls + '"' : ''} ${cls === 'aktif' ? 'aria-current="page"' : ''} aria-label="Halaman ${p}">${t}</a>`;
  const set = new Set([1, total, halaman, halaman - 1, halaman + 1, halaman - 2, halaman + 2].filter(p => p >= 1 && p <= total));
  const arr = Array.from(set).sort((a, b) => a - b);
  let out = '', prev = 0;
  if (halaman > 1) out += link(halaman - 1, 'Sebelumnya');
  arr.forEach(p => { if (p - prev > 1) out += '<span class="mati">…</span>'; out += link(p, p, p === halaman ? 'aktif' : ''); prev = p; });
  if (halaman < total) out += link(halaman + 1, 'Berikutnya');
  return `<nav class="halaman" aria-label="Halaman hasil">${out}</nav>`;
}
function chipList(s) { return String(s || '').split(',').map(x => x.trim()).filter(Boolean).map(x => `<span class="chip">${esc(x)}</span>`).join(''); }

const KOLOM_DAFTAR = new Set(['misi', 'tujuan', 'prestasi_daftar']);
const RE_BUTIR = /^\s*(?:\d{1,2}\s*[.)]|[a-hA-H]\s*[.)]|[-•*–—·▪●○])\s*/;
function pecahKalimat(t) {
  const k = t.match(/[^.!?]+(?:[.!?]+["')\]]*(?=\s|$)|$)/g) || [t];
  const hasil = []; let cur = '';
  k.forEach(x => { x = x.trim(); if (!x) return; if (cur && (cur + ' ' + x).length > 520) { hasil.push(cur); cur = x; } else cur = cur ? cur + ' ' + x : x; });
  if (cur) hasil.push(cur);
  return hasil;
}
function formatTeks(v, kolom) {
  const t = String(v).replace(/\r\n?/g, '\n').replace(/[ \t ]+/g, ' ').trim();
  if (!t) return '';
  // butir bernomor yang tertulis dalam satu baris: "1. a 2. b 3. c"
  let isi = t;
  if (!/\n\s*\d{1,2}\s*[.)]/.test(isi) && /(^|\s)1\s*[.)]\s*\S[\s\S]*?\s2\s*[.)]\s*\S/.test(isi)) isi = isi.replace(/\s+(?=\d{1,2}\s*[.)]\s*\S)/g, '\n');
  const baris = isi.split('\n').map(x => x.trim()).filter(Boolean);
  const daftarKolom = KOLOM_DAFTAR.has(kolom);
  const berButir = baris.filter(x => RE_BUTIR.test(x)).length;
  const bernomor = baris.filter(x => /^\d{1,2}\s*[.)]/.test(x)).length >= Math.ceil(baris.length / 2);
  const jadiDaftar = berButir >= 2 || (daftarKolom && baris.length >= 2);
  const li = x => `<li>${esc(x.replace(RE_BUTIR, ''))}</li>`;
  if (jadiDaftar) {
    let out = '', buf = [];
    const tutup = () => { if (buf.length) { out += (bernomor ? '<ol>' : '<ul>') + buf.map(li).join('') + (bernomor ? '</ol>' : '</ul>'); buf = []; } };
    baris.forEach((x, i) => {
      const butir = RE_BUTIR.test(x) || (daftarKolom && !(i === 0 && /:\s*$/.test(x)));
      if (butir) buf.push(x); else { tutup(); out += `<p${/:\s*$/.test(x) ? ' class="pembuka"' : ''}>${esc(x)}</p>`; }
    });
    tutup();
    return out;
  }
  // paragraf biasa; satu blok panjang dipecah per beberapa kalimat
  const blok = isi.split(/\n+/).map(x => x.trim()).filter(Boolean);
  const hasil = [];
  blok.forEach(b => { if (b.length > 650) pecahKalimat(b).forEach(x => hasil.push(x)); else hasil.push(b); });
  return hasil.map(x => `<p>${esc(x)}</p>`).join('');
}
function peringatanHtml(arr) {
  return `<div class="p-daftar">${arr.map(w => typeof w === 'string' ? `<div class="p-item"><div>${esc(w)}</div></div>`
    : `<div class="p-item"><div class="p-judul">${esc(w.judul)}</div><div class="p-baris">${(w.baris || []).map(b => `<div>${esc(b)}</div>`).join('')}</div>${w.saran ? `<div class="p-saran">${esc(w.saran)}</div>` : ''}</div>`).join('')}</div>`;
}
/* foto sampul: pilihan admin; bila belum dipilih, foto kedua (foto pertama umumnya logo); terakhir foto pertama */
function pilihSampul(foto) {
  if (!foto || !foto.length) return null;
  const eks = foto.find(f => f.sampul); if (eks) return { f: eks, eksplisit: true };
  return { f: foto[1] || foto[0], eksplisit: false, mungkinLogo: !foto[1] };
}
function nilaiHtml(c, v) {
  if (v === '' || v === null || v === undefined) return '<span class="kosong">Belum diisi</span>';
  const sat = satuanTeks(c) ? ' ' + satuanTeks(c) : '';
  switch (c.tipe) {
    case 'angka': case 'desimal': return esc(ang(v)) + esc(sat);
    case 'tahun': return esc(v);
    case 'url': { const u = safeUrl(v); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(String(v).replace(/^https?:\/\//i, '').replace(/\/$/, ''))}</a>` : esc(v); }
    case 'email': return `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
    case 'telp': return String(v).split(' / ').map(t => `<a href="tel:${esc(t)}">${esc(t)}</a>`).join(', ');
    case 'multi': return `<span class="chips">${chipList(v)}</span>`;
    case 'teks_panjang': return `<div class="teks-rapi">${formatTeks(v, c.kolom)}</div>`;
    default: return esc(v);
  }
}
function sekilasHtml(p) {
  const row = (t, v) => v === '' || v === undefined || v === null ? '' : `<div><dt>${esc(t)}</dt><dd>${v}</dd></div>`;
  return row('Santri', ang(p.santri_total)) + row('Tenaga pendidik', ang(p.gtk_pendidik)) + row('Berdiri', esc(p.tahun_berdiri))
    + row('Luas lahan', p.lahan_total_ha === '' ? '' : esc(ang(p.lahan_total_ha)) + ' ha') + row('NSP', esc(p.nsp)) + row('NRPM', esc(p.nrpm));
}

   FORMULIR UBAH
   ==================================================================== */
const MAKS_BERKAS = { foto: 12, aset: 20, prestasi: 20 };
const JUDUL_BERKAS = { foto: 'Foto pesantren (logo, bangunan, kegiatan)', aset: 'Dokumen aset pesantren', prestasi: 'Berkas daftar prestasi' };

/* ---- kunci isian sesuai jenisnya (angka, tahun, desimal, telepon, email, tautan, nomor 12 digit) ---- */
const RX_URL = /^(https?:\/\/|@)/i, RX_DOMAIN = /^[\w.-]+\.[a-z]{2,}(\/|$)/i;
const ATURAN = {
  angka: { bersih: v => v.replace(/\D/g, '').slice(0, 8), cek: () => '', pesan: 'Kolom ini hanya menerima angka 0–9.', ph: '0', im: 'numeric' },
  tahun: { bersih: v => v.replace(/\D/g, '').slice(0, 4), cek: v => { if (!v) return ''; const y = +v, n = new Date().getFullYear(); return (v.length < 4 || y < 1800 || y > n) ? `Tahun harus 4 digit, antara 1800 dan ${n}.` : ''; }, pesan: 'Kolom ini hanya menerima angka.', ph: 'contoh: 1995', im: 'numeric' },
  desimal: { bersih: v => { let o = '', sep = false; for (const ch of v) { if (/\d/.test(ch)) o += ch; else if ((ch === ',' || ch === '.') && !sep) { o += ch; sep = true; } } return o.slice(0, 14); }, cek: v => (v && isNaN(Number(v.replace(',', '.')))) ? 'Isi dengan angka, contoh 1,5 atau 2.5.' : '', pesan: 'Hanya angka, dengan satu koma atau titik untuk desimal.', ph: 'contoh: 2,5', im: 'decimal' },
  telp: { bersih: v => v.replace(/[^0-9+\-\s\/().]/g, '').slice(0, 80), cek: v => { if (!v) return ''; return v.split('/').some(x => { const d = x.replace(/\D/g, ''); return d.length < 8 || d.length > 15; }) ? 'Nomor harus 8–15 digit. Beberapa nomor dipisah tanda /.' : ''; }, pesan: 'Hanya angka, spasi, dan tanda + - ( ) /.', ph: 'contoh: 0812 3456 7890', im: 'tel' },
  email: { bersih: v => v.replace(/\s/g, '').toLowerCase().slice(0, 120), cek: v => (v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) ? 'Format email belum benar, contoh: nama@domain.com.' : '', pesan: 'Email tidak boleh memuat spasi.', ph: 'nama@domain.com', im: 'email' },
  url: { bersih: v => v.replace(/\s/g, '').slice(0, 500), cek: v => (!v || v === '-' || RX_URL.test(v) || RX_DOMAIN.test(v)) ? '' : 'Isi dengan tautan yang diawali https:// atau http://.', pesan: 'Tautan tidak boleh memuat spasi.', ph: 'https://', im: 'url', blur: v => (v && v !== '-' && !RX_URL.test(v) && RX_DOMAIN.test(v)) ? 'https://' + v : v },
  id12: { bersih: v => v.replace(/\D/g, '').slice(0, 12), cek: v => (v && v.length !== 12) ? `Harus 12 digit angka (sekarang ${v.length}).` : '', pesan: 'Kolom ini hanya menerima angka.', ph: '12 digit', im: 'numeric' },
  teks: { bersih: v => v.replace(/[\u0000-\u001F\u007F]+/g, ' ').slice(0, 500), cek: () => '' },
  teks_panjang: { bersih: v => v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '').slice(0, 20000), cek: () => '' }
};
function jenisAturan(c) { if (c.kolom === 'nsp' || c.kolom === 'nrpm') return 'id12'; return ATURAN[c.tipe] ? c.tipe : ''; }
function tampilErr(f, m) {
  f.classList.toggle('salah', !!m);
  let er = $('.err', f);
  if (!er) { er = document.createElement('span'); er.className = 'err'; er.setAttribute('role', 'alert'); f.appendChild(er); }
  er.textContent = m || '';
}
function pasangKunci(root) {
  root.addEventListener('input', e => {
    const t = e.target, j = t.dataset && t.dataset.aturan; if (!j || !ATURAN[j]) return;
    const A = ATURAN[j], f = t.closest('.fl'), raw = t.value, bersih = A.bersih(raw);
    if (bersih !== raw) {
      const pos = (t.selectionStart == null ? raw.length : t.selectionStart) - (raw.length - bersih.length);
      t.value = bersih; try { t.setSelectionRange(Math.max(0, pos), Math.max(0, pos)); } catch (x) { }
      if (bersih.length < raw.length && A.pesan && f) { tampilErr(f, A.pesan); clearTimeout(f._tk); f._tk = setTimeout(() => { f._tk = null; if (!A.cek(t.value)) tampilErr(f, ''); }, 2500); }
    } else if (f && !f._tk && f.classList.contains('salah') && !A.cek(bersih)) tampilErr(f, '');
  }, true);
  root.addEventListener('focusout', e => {
    const t = e.target, j = t.dataset && t.dataset.aturan; if (!j || !ATURAN[j]) return;
    const A = ATURAN[j], f = t.closest('.fl');
    if (A.blur) { const nv = A.blur(t.value); if (nv !== t.value) { t.value = nv; t.dispatchEvent(new Event('input', { bubbles: true })); } }
    if (f) tampilErr(f, A.cek(t.value.trim()));
  });
}
/* periksa semua isian bertanda; kembalikan daftar .fl yang salah */
function periksaAturan(root, hanya) {
  const salah = [];
  $$('[data-aturan]', root).forEach(t => {
    const f = t.closest('.fl'); if (!f) return;
    if (hanya && !hanya.includes(f.dataset.k)) return;
    const m = ATURAN[t.dataset.aturan].cek(t.value.trim());
    tampilErr(f, m); if (m) salah.push(f);
  });
  return salah;
}

function kolomPenuh(c) { return c.tipe === 'teks_panjang' || c.tipe === 'multi' || ['alamat', 'jenis_unit_usaha', 'produk_unggulan', 'catatan_migrasi'].includes(c.kolom); }
function fieldForm(c, v, meta, ro, paksaPenuh) {
  const id = 'f_' + c.kolom, lab = label(c), wajib = c.wajib ? '<span class="wajib" aria-hidden="true">*</span>' : '';
  const hint = petunjukDari(c) ? `<span class="hint" id="h_${c.kolom}">${esc(petunjukDari(c))}</span>` : '';
  const dis = ro ? 'disabled' : '';
  const desc = petunjukDari(c) ? `aria-describedby="h_${c.kolom}"` : '';
  const penuh = (kolomPenuh(c) || paksaPenuh) ? ' penuh' : '';
  let ctrl = '';
  const ops = (meta.opsi[c.opsi] || []);
  if (c.tipe === 'multi') {
    const sel = String(v || '').split(',').map(x => x.trim());
    ctrl = `<div class="pilih-multi" role="group" aria-label="${esc(lab)}">${ops.map(o => `<label><input type="checkbox" data-multi="${c.kolom}" value="${esc(o.nilai)}" ${sel.includes(o.nilai) ? 'checked' : ''} ${dis}>${esc(o.label || o.nilai)}</label>`).join('')}</div>`;
    return `<div class="fl${penuh}" data-k="${c.kolom}"><span class="lab">${esc(lab)}${wajib}</span><div class="ctl">${ctrl}</div><div class="cat">${hint}<span class="err" role="alert"></span></div></div>`;
  }
  if (['pilihan', 'ya_tidak', 'sudah_belum'].includes(c.tipe)) {
    const lst = ops.length ? ops : (c.tipe === 'ya_tidak' ? [{ nilai: 'Ya' }, { nilai: 'Tidak' }] : [{ nilai: 'Sudah' }, { nilai: 'Belum' }]);
    ctrl = `<select id="${id}" ${dis} ${desc}><option value="">— Pilih —</option>${lst.map(o => `<option value="${esc(o.nilai)}" ${o.nilai === v ? 'selected' : ''}>${esc(o.label || o.nilai)}</option>`).join('')}</select>`;
  } else if (c.tipe === 'teks_panjang') {
    ctrl = `<textarea id="${id}" data-aturan="teks_panjang" rows="${['sejarah', 'prestasi_daftar'].includes(c.kolom) ? 9 : 5}" ${dis} ${desc}>${esc(v)}</textarea>`;
  } else {
    const jn = jenisAturan(c), A = jn ? ATURAN[jn] : null;
    const kunci = A ? `data-aturan="${jn}" ${A.im ? `inputmode="${A.im}"` : ''} ${A.ph && !['teks'].includes(jn) ? `placeholder="${esc(A.ph)}"` : ''} ${['email', 'url'].includes(jn) ? 'autocapitalize="off" spellcheck="false"' : ''}` : '';
    const list = ['kab_kota', 'kecamatan'].includes(c.kolom) ? `list="dl_${c.kolom}"` : '';
    const inp = `<input id="${id}" type="text" ${kunci} ${list} value="${esc(v)}" ${dis} ${desc} autocomplete="off">`;
    const suf = c.satuan && !SATUAN[c.satuan] ? c.satuan : (SATUAN[c.satuan] && c.tipe !== 'angka' ? SATUAN[c.satuan] : (c.satuan === 'orang' ? 'orang' : ''));
    ctrl = suf ? `<div class="sufiks">${inp}<span>${esc(suf)}</span></div>` : inp;
    if (list) ctrl += `<datalist id="dl_${c.kolom}"></datalist>`;
  }
  return `<div class="fl${penuh}" data-k="${c.kolom}"><label for="${id}">${esc(lab)}${wajib}</label><div class="ctl">${ctrl}</div><div class="cat">${hint}<span class="err" role="alert"></span></div></div>`;
}

/* susun kolom berpasangan; kolom ganjil yang sendirian dilebarkan agar tidak ada kotak bolong */
function susunKolom(cs) {
  const out = []; let run = [];
  const tutup = () => { if (run.length % 2 === 1) run[run.length - 1].penuh = true; out.push(...run); run = []; };
  cs.forEach(c => { if (kolomPenuh(c)) { tutup(); out.push({ c, penuh: true }); } else run.push({ c, penuh: false }); });
  tutup();
  return out;
}
function bacaForm(root, meta) {
  const out = {};
  meta.kolom.forEach(c => {
    if (c.tipe === 'multi') { const cs = $$(`[data-multi="${c.kolom}"]`, root); if (cs.length) out[c.kolom] = cs.filter(x => x.checked).map(x => x.value); return; }
    const e = $('#f_' + c.kolom, root);
    if (e) out[c.kolom] = e.value;
  });
  return out;
}
const sama = (a, b) => {
  if (Array.isArray(a)) a = a.join(', ');
  if (Array.isArray(b)) b = b.join(', ');
  return String(a ?? '').trim() === String(b ?? '').trim();
};
